<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MRM-44 — Mobile Rhythm Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Audiowide&family=Rajdhani:wght@500;600;700&family=VT323&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507;
    --chassis:#0e0e13; --chassis-2:#08080b;
    --edge-a:#1a1e26; --edge-b:#0a0c10;
    --panel:#16161c; --panel-inset:#0a0a0d;
    --blue:#3fa9ff; --blue-2:#8fd4ff; --blue-dim:#1c4666;
    --white:#f4f5f7; --dim:#7d818c; --metal:#c7cbd4;
    --lcd-bg:#04070a; --lcd-fg:#5fc2ff;
  }
  *{box-sizing:border-box; -webkit-touch-callout:none;}
  html,body{
    margin:0; height:100%; background:var(--bg);
    font-family:'Rajdhani',sans-serif; color:var(--white);
    overscroll-behavior:none; user-select:none; touch-action:manipulation;
  }
  .lcd{font-family:'VT323',monospace;}
  #stage{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse 70% 40% at 50% -10%, rgba(63,169,255,0.10), transparent 60%), var(--bg);
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }
  #unit{
    width:min(520px,100vw); height:min(960px,100vh);
    display:flex; background:linear-gradient(90deg,var(--edge-b),var(--edge-a) 3%,var(--edge-a) 97%,var(--edge-b));
    border-radius:14px; box-shadow:0 30px 80px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    padding:0 7px;
  }
  @supports (height: 100dvh){
    #unit{ height:min(960px,100dvh); }
  }
  .wood-grain{ width:9px; flex-shrink:0; border-radius:4px;
    background:linear-gradient(180deg, rgba(63,169,255,.05), rgba(63,169,255,.35), rgba(63,169,255,.05));
    box-shadow:0 0 10px rgba(63,169,255,.35); }

  #panelMain{
    flex:1; min-width:0; background:linear-gradient(180deg,var(--chassis),var(--chassis-2));
    border-radius:8px; padding:6px 9px 8px;
    display:flex; flex-direction:column; gap:6px; position:relative;
    overflow-y:auto; overflow-x:hidden;
  }
  #panelMain::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0, rgba(255,255,255,.012) 1px, transparent 1px, transparent 4px); }
  #panelMain > *{ position:relative; z-index:1; flex-shrink:0; }

  .screw{ position:absolute; width:7px; height:7px; border-radius:50%; z-index:2;
    background:radial-gradient(circle at 35% 30%, #cfd3da, #4a4e57 55%, #16171b 100%); box-shadow:0 1px 1px rgba(0,0,0,.7); }
  .screw::after{ content:""; position:absolute; top:50%; left:14%; width:72%; height:1px; background:rgba(0,0,0,.6); transform:rotate(35deg); }
  .screw.tl{top:6px;left:6px;} .screw.tr{top:6px;right:6px;} .screw.bl{bottom:6px;left:6px;} .screw.br{bottom:6px;right:6px;}

  /* ---------- Nameplate ---------- */
  .brandtop{
    text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700;
    font-size:clamp(9px,2.4vw,11px); letter-spacing:.4em; text-indent:.4em;
    color:var(--dim); padding:3px 0 1px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .brandtop .ln{ flex:1; max-width:56px; height:1px;
    background:linear-gradient(90deg, transparent, rgba(63,169,255,.4), transparent); }
  .brandtop .star{ color:var(--blue); font-size:8px; text-shadow:0 0 8px rgba(63,169,255,.8); }

  .brandbar{ display:flex; align-items:center; justify-content:space-between; padding:1px 8px 4px; border-bottom:1px solid rgba(255,255,255,.06); }
  .brandbar .logo{ font-family:'Audiowide',sans-serif; font-size:clamp(15px,4.4vw,20px); letter-spacing:.02em; color:var(--white);
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 16px rgba(63,169,255,.35); }
  .brandbar .logo span{color:var(--blue); text-shadow:0 0 12px rgba(63,169,255,.8);}
  .powerled{ width:8px; height:8px; border-radius:50%; background:#0e1e2c; margin-left:8px; display:inline-block; transition:all .2s; }
  .powerled.on{ background:var(--blue); box-shadow:0 0 10px var(--blue), 0 0 20px rgba(63,169,255,.6); }
  .brandbar .tag{font-size:clamp(8px,2vw,10px); letter-spacing:.18em; color:var(--dim); text-transform:uppercase;}

  .lcd-screen{ background:var(--lcd-bg); border-radius:6px; padding:4px 10px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.85), inset 0 0 0 1px #000, 0 0 14px rgba(63,169,255,.08);
    display:flex; align-items:baseline; justify-content:space-between; gap:6px; flex-wrap:wrap;
    color:var(--lcd-fg); text-shadow:0 0 8px rgba(95,194,255,.75); }
  .lcd-screen .l1{font-size:clamp(14px,4vw,18px); letter-spacing:.04em;}
  .lcd-screen .l2{font-size:clamp(11px,3vw,13px); opacity:.85;}

  .transport{ display:flex; align-items:center; gap:clamp(6px,2vw,12px); background:var(--panel-inset);
    border-radius:10px; padding:7px 9px; box-shadow:inset 0 2px 6px rgba(0,0,0,.6); flex-wrap:wrap; }
  #playBtn{ width:clamp(42px,11vw,50px); height:clamp(42px,11vw,50px); border-radius:50%; border:1px solid rgba(255,255,255,.1);
    background:radial-gradient(circle at 35% 30%, #23262e, #0c0d10); box-shadow:0 3px 0 #000, 0 6px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(63,169,255,.25);
    color:var(--blue); font-size:clamp(15px,3.6vw,18px); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; transition:transform .08s; }
  #playBtn:active{transform:translateY(2px); box-shadow:0 1px 0 #000;}
  #playBtn.playing{ background:radial-gradient(circle at 35% 30%, #1a3d5c, #0c1e2e); color:var(--blue-2);
    box-shadow:0 3px 0 #000, 0 0 20px rgba(63,169,255,.6), inset 0 0 0 1px rgba(63,169,255,.5); }
  .knob-cluster{display:flex; gap:clamp(6px,2.2vw,14px); flex:1; justify-content:space-evenly; min-width:120px;}
  .btn-cluster{display:flex; gap:6px; flex-shrink:0;}
  .chip-btn{ padding:6px 10px; border-radius:7px; border:1px solid rgba(255,255,255,.08); background:var(--panel);
    color:var(--dim); font-weight:600; font-size:clamp(9px,2.3vw,11px); letter-spacing:.05em; cursor:pointer;
    text-transform:uppercase; white-space:nowrap; }
  .chip-btn:active{transform:scale(.93); color:var(--white); border-color:rgba(63,169,255,.4);}

  #kitRow{ display:flex; gap:6px; overflow-x:auto; padding:1px 1px 2px; -webkit-overflow-scrolling:touch; }
  .kit-chip{
    flex-shrink:0; padding:7px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.08);
    background:var(--panel); cursor:pointer; text-align:left; min-width:104px;
  }
  .kit-chip .kn{ font-weight:700; font-size:clamp(10px,2.6vw,12px); letter-spacing:.04em; color:var(--dim); }
  .kit-chip .kd{ font-size:clamp(8px,2vw,9px); color:var(--dim); opacity:.75; letter-spacing:.02em; }
  .kit-chip.active{ border-color:var(--blue); background:rgba(63,169,255,.12); box-shadow:0 0 12px rgba(63,169,255,.25); }
  .kit-chip.active .kn{ color:var(--blue-2); }

  .knob{display:flex; flex-direction:column; align-items:center; gap:2px; touch-action:none;}
  .knob-dial{ width:var(--ks,36px); height:var(--ks,36px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a2d34, #0c0d10); border:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 0 rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(63,169,255,.12);
    position:relative; cursor:grab; }
  .knob-dial .ind{ position:absolute; left:50%; bottom:50%; margin-left:-1px; width:2px; height:38%; background:var(--blue);
    border-radius:2px; box-shadow:0 0 6px var(--blue), 0 0 12px rgba(63,169,255,.5); transform-origin:50% 100%; }
  .knob-label{font-size:clamp(7px,1.7vw,9px); letter-spacing:.1em; color:var(--dim); text-transform:uppercase;}
  .knob-val{font-size:clamp(8px,1.9vw,10px); color:var(--white); font-family:'JetBrains Mono',monospace;}

  /* ---------- OVERVIEW (glanceable + Volume pro Sound) ---------- */
  #overview{ background:var(--panel-inset); border-radius:8px; padding:6px 8px; box-shadow:inset 0 2px 6px rgba(0,0,0,.5); }
  .ov-row{ display:grid; grid-template-columns:32px 22px repeat(16,1fr); align-items:center; gap:3px;
    padding:2px 0; border-radius:4px; cursor:pointer; }
  .ov-row.active{ background:rgba(63,169,255,.10); }
  .ov-row .ov-label{ font-size:8px; font-weight:700; letter-spacing:.03em; color:var(--dim); cursor:pointer; }
  .ov-row.active .ov-label{ color:var(--blue-2); }
  .ov-row .knob-dial{ --ks:18px; cursor:grab; }
  .ov-mute{ width:22px; height:22px; border-radius:5px; border:1px solid rgba(255,255,255,.12); background:var(--panel-inset);
    color:var(--dim); font-size:9px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .ov-mute.on{ background:var(--blue); color:#04121e; border-color:var(--blue); box-shadow:0 0 8px rgba(63,169,255,.5); }
  .ov-mute:active{ transform:scale(.92); }
  .ov-row.muted .ov-cell{ opacity:.3; }
  .ov-cell{ height:7px; border-radius:2px; background:#0c0d10; cursor:pointer; }
  .ov-cell.on{ background:var(--tc); box-shadow:0 0 6px var(--tc); }
  .ov-cell.playcol{ outline:1px solid rgba(255,255,255,.6); outline-offset:-1px; }

  /* ---------- TRACK DETAIL BAR ---------- */
  #trackBar{ display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border-radius:8px; padding:6px 10px; }
  #trackBar .name{ font-weight:700; font-size:clamp(14px,4vw,17px); letter-spacing:.03em; display:flex; align-items:center; gap:8px; color:var(--white); }
  #trackBar .dot{ width:10px; height:10px; border-radius:50%; background:var(--tc); box-shadow:0 0 8px var(--tc); }
  #trackBar .preview{ font-size:11px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
    border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:5px 9px; }
  #trackBar .preview:active{ transform:scale(.94); border-color:rgba(63,169,255,.5); }
  #trackBar .mini-knobs{ display:flex; gap:8px; }
  #trackBar .knob-dial{ --ks:26px; }

  /* ---------- BIG EDIT GRID ---------- */
  #bigGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(6px,2vw,10px); }
  .bstep{
    aspect-ratio:1/0.86;
    border-radius:10px; background:#0b0c0f;
    border:1px solid rgba(255,255,255,.06); box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
    position:relative; cursor:pointer; display:flex; align-items:flex-end; justify-content:flex-start;
    padding:5px; transition:filter .05s;
  }
  .bstep:active{ filter:brightness(1.3); }
  .bstep .num{ font-family:'JetBrains Mono',monospace; font-size:10px; color:rgba(255,255,255,.28); }
  .bstep.beat-start{ border-left:2px solid rgba(255,255,255,.15); }
  .bstep.on{ background:var(--tc); box-shadow:0 0 16px var(--tc), inset 0 1px 1px rgba(255,255,255,.4); }
  .bstep.on .num{ color:rgba(0,0,0,.5); }
  .bstep.playcol{ outline:2px solid rgba(255,255,255,.7); outline-offset:-2px; }
  .bstep.flash{ filter:brightness(2); }
  .bstep.accent-on::before{ content:""; position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%;
    background:var(--white); box-shadow:0 0 8px var(--blue-2), 0 0 4px #fff; }
  #bigGrid.accentmode .bstep{ border:2px solid rgba(63,169,255,.3); }

  #accentToggle{
    align-self:center; padding:9px 18px; border-radius:999px; border:1px solid rgba(63,169,255,.3);
    background:var(--panel); color:var(--dim); font-weight:700; letter-spacing:.12em; font-size:12px;
    text-transform:uppercase; cursor:pointer; text-align:center;
  }
  #accentToggle.on{ background:var(--blue); color:#04121e; box-shadow:0 0 18px rgba(63,169,255,.6); border-color:var(--blue); }

  footer.hint{ text-align:center; font-size:clamp(8px,2vw,10px); color:var(--dim); letter-spacing:.05em; padding:2px 0 2px; }

  /* ---------- MIC-SAMPLE AUFNAHME ---------- */
  #trackBar .rec-controls{ display:flex; align-items:center; gap:8px; }
  #recBtn{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    border:1px solid rgba(63,169,255,.35); border-radius:6px; padding:5px 10px;
    color:var(--dim); background:var(--panel); white-space:nowrap; }
  #recBtn:active{ transform:scale(.94); }
  #recBtn.recording{ background:var(--blue); color:#04121e; border-color:var(--blue);
    box-shadow:0 0 14px rgba(63,169,255,.7); animation:recpulse 1s infinite; }
  @keyframes recpulse{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
  #recStatus{ font-size:9px; color:var(--dim); font-family:'JetBrains Mono',monospace; letter-spacing:.03em; min-width:56px; }
  #recStatus.err{ color:var(--white); text-shadow:0 0 6px rgba(255,255,255,.5); }
  #sampleClearBtn{ font-size:10px; color:var(--dim); border:1px solid rgba(255,255,255,.12); border-radius:6px;
    padding:5px 8px; cursor:pointer; background:transparent; }
  #sampleClearBtn:active{ transform:scale(.94); border-color:rgba(63,169,255,.5); }

  /* ---------- SAMPLE-TRIM-EDITOR ---------- */
  #trimBtn{ font-size:10px; color:var(--dim); border:1px solid rgba(255,255,255,.12); border-radius:6px;
    padding:5px 8px; cursor:pointer; background:transparent; white-space:nowrap; }
  #trimBtn:active{ transform:scale(.94); border-color:rgba(63,169,255,.5); }
  #trimPanel{ display:none; flex-direction:column; gap:6px; background:var(--panel); border-radius:8px; padding:8px 10px; }
  #trimPanel.open{ display:flex; }
  #trimCanvasWrap{ position:relative; width:100%; height:70px; border-radius:6px; overflow:hidden; background:var(--panel-inset); touch-action:none; }
  #trimCanvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #trimHandle{ position:absolute; top:0; bottom:0; width:12px; margin-left:-6px; cursor:ew-resize; }
  #trimHandle::before{ content:""; position:absolute; top:0; bottom:0; left:5px; width:2px; background:var(--blue);
    box-shadow:0 0 6px var(--blue), 0 0 12px rgba(63,169,255,.6); }
  #trimHandle::after{ content:""; position:absolute; top:-2px; left:1px; width:10px; height:10px; border-radius:50%;
    background:var(--blue); box-shadow:0 0 6px var(--blue); }
  #trimDim{ position:absolute; top:0; bottom:0; left:0; background:rgba(0,0,0,.55); pointer-events:none; }
  #trimRow{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #trimLabel{ font-size:9px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
  #trimBtns{ display:flex; gap:6px; }
  #trimPreviewBtn, #trimApplyBtn, #trimCancelBtn{ font-size:10px; letter-spacing:.04em; text-transform:uppercase;
    border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:5px 9px; cursor:pointer; background:transparent; color:var(--dim); }
  #trimApplyBtn{ border-color:rgba(63,169,255,.4); color:var(--blue-2); }
  #trimPreviewBtn:active, #trimApplyBtn:active, #trimCancelBtn:active{ transform:scale(.94); }

  /* ---------- PATTERN-SPEICHER-PANEL ---------- */
  #patternsPanel{ display:none; flex-direction:column; gap:8px; background:var(--panel); border-radius:8px; padding:8px 10px; }
  #patternsPanel.open{ display:flex; }
  #patternSaveRow{ display:flex; gap:6px; }
  #patternNameInput{ flex:1; min-width:0; background:var(--panel-inset); border:1px solid rgba(255,255,255,.12); border-radius:6px;
    padding:7px 9px; color:var(--white); font-family:'Rajdhani',sans-serif; font-size:13px; }
  #patternNameInput::placeholder{ color:var(--dim); }
  #patternSaveBtn{ font-size:10px; letter-spacing:.04em; text-transform:uppercase; border:1px solid rgba(63,169,255,.4);
    border-radius:6px; padding:7px 12px; cursor:pointer; background:rgba(63,169,255,.12); color:var(--blue-2); white-space:nowrap; }
  #patternSaveBtn:active{ transform:scale(.94); }
  #patternList{ display:flex; flex-direction:column; gap:5px; max-height:180px; overflow-y:auto; }
  .pattern-row{ display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:var(--panel-inset); border-radius:6px; padding:6px 8px; }
  .pattern-row .pname{ font-size:12px; color:var(--white); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .pattern-row .pdate{ font-size:8px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
  .pattern-row .pbtns{ display:flex; gap:4px; flex-shrink:0; }
  .pattern-row button{ font-size:9px; text-transform:uppercase; border:1px solid rgba(255,255,255,.12); border-radius:5px;
    padding:4px 7px; cursor:pointer; background:transparent; color:var(--dim); }
  .pattern-row .pload{ border-color:rgba(63,169,255,.4); color:var(--blue-2); }
  .pattern-row button:active{ transform:scale(.92); }
  #patternEmpty{ font-size:11px; color:var(--dim); text-align:center; padding:6px 0; }

  /* ---------- SAMPLE-PAD (live, 9 Pads) ---------- */
  #padSection{ background:var(--panel-inset); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  #padHeader{ display:flex; align-items:center; justify-content:space-between; }
  #padHeader .ptitle{ font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--dim); text-transform:uppercase; }
  #padRecToggle{ font-size:10px; letter-spacing:.04em; text-transform:uppercase; border:1px solid rgba(63,169,255,.35);
    border-radius:6px; padding:6px 10px; cursor:pointer; background:var(--panel); color:var(--dim); }
  #padRecToggle.on{ background:var(--blue); color:#04121e; border-color:var(--blue); box-shadow:0 0 12px rgba(63,169,255,.5); }
  #padRecToggle:active{ transform:scale(.94); }
  #padGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad{ aspect-ratio:1/0.8; border-radius:10px; background:#0b0c0f; border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; cursor:pointer; position:relative; }
  .pad .plabel{ font-size:10px; font-weight:700; color:var(--dim); letter-spacing:.05em; }
  .pad .pstat{ font-size:8px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
  .pad.filled{ border-color:rgba(63,169,255,.35); box-shadow:inset 0 2px 4px rgba(0,0,0,.6), 0 0 10px rgba(63,169,255,.15); }
  .pad.filled .plabel{ color:var(--blue-2); }
  .pad:active{ filter:brightness(1.3); }
  .pad.recording{ background:var(--blue); box-shadow:0 0 16px rgba(63,169,255,.7); animation:recpulse 1s infinite; }
  .pad.recording .plabel, .pad.recording .pstat{ color:#04121e; }
  .pad.flash{ filter:brightness(1.8); }
</style>
</head>
<body>

<div id="stage">
  <div id="unit">
    <div class="wood-grain"></div>
    <div id="panelMain">
      <div class="screw tl"></div><div class="screw tr"></div><div class="screw bl"></div><div class="screw br"></div>

      <div class="brandtop"><span class="ln"></span><span class="star">✦</span>Drumstar<span class="star">✦</span><span class="ln"></span></div>

      <div class="brandbar">
        <div style="display:flex; align-items:center;">
          <div class="logo">MRM-<span>44</span></div>
          <div class="powerled" id="powerLed"></div>
        </div>
        <div class="tag">Mobile Rhythm Machine</div>
      </div>

      <div class="lcd-screen">
        <span class="lcd l1" id="lcdBpm">128 BPM</span>
        <span class="lcd l1" id="lcdKit">FM-909</span>
        <span class="lcd l2 mono" id="lcdStep">STEP 01/16</span>
      </div>

      <div id="kitRow"></div>

      <div class="transport">
        <div id="playBtn">▶</div>
        <div class="knob-cluster" id="globalKnobs"></div>
        <div class="btn-cluster">
          <button class="chip-btn" id="randomBtn">Random</button>
          <button class="chip-btn" id="clearBtn">Clear</button>
          <button class="chip-btn" id="patternsToggleBtn">💾 Beats</button>
        </div>
      </div>

      <div id="patternsPanel">
        <div id="patternSaveRow">
          <input type="text" id="patternNameInput" placeholder="Name für aktuellen Beat…" maxlength="40">
          <button id="patternSaveBtn">Speichern</button>
        </div>
        <div id="patternList"></div>
      </div>

      <div id="overview"></div>

      <div id="trackBar">
        <div class="name"><span class="dot" id="tbDot"></span><span id="tbName">BASS DRUM</span></div>
        <div class="mini-knobs" id="tbKnobs"></div>
        <div class="rec-controls" id="recControls" style="display:none;">
          <span id="recStatus">kein Sample</span>
          <button id="samplePreviewBtn" class="preview" style="display:none; padding:5px 8px;">▶</button>
          <button id="trimBtn" style="display:none;">✂</button>
          <button id="sampleClearBtn" style="display:none;">✕</button>
          <button id="recBtn">● Rec</button>
        </div>

<script>
(function(){
"use strict";

// =========================================================================
// AUDIO ENGINE — AudioWorklet-basierter Multi-Operator-FM-Synth
// =========================================================================
let audioCtx=null, master=null, comp=null, noiseBuf=null, workletReady=null, useWorklet=false;
let reverbInputNode=null, reverbConvolver=null;
let currentTrackBus=null;

// Erzeugt eine synthetische Hall-Impulsantwort: Rauschen mit exponentiellem
// Decay pro Kanal, kein externes Audio-File nötig.
function createImpulseResponse(duration, decay){
  const rate=audioCtx.sampleRate;
  const length=Math.floor(rate*duration);
  const impulse=audioCtx.createBuffer(2, length, rate);
  for(let c=0;c<2;c++){
    const data=impulse.getChannelData(c);
    for(let i=0;i<length;i++){
      data[i]=(Math.random()*2-1)*Math.pow(1-i/length, decay);
    }
  }
  return impulse;
}
// Jede Spur bekommt einen eigenen Bus: trocken immer zu 100% zum Master,
// zusätzlich ein regelbarer Send-Anteil zum gemeinsamen Hall-Bus.
function ensureTrackBuses(){
  TRACKS.forEach(tr=>{
    if(tr.bus) return;
    tr.bus=audioCtx.createGain();
    tr.bus.connect(master);
    tr.sendGain=audioCtx.createGain();
    tr.reverbAmount = tr.reverbAmount || 0;
    tr.sendGain.gain.value=tr.reverbAmount;
    tr.bus.connect(tr.sendGain);
    tr.sendGain.connect(reverbInputNode);
  });
}
// Alle Synth-Funktionen verbinden sich hierüber statt direkt mit "master",
// damit ihr Signal über den aktuell getriggerten Track-Bus läuft.
function getBus(){ return currentTrackBus || master; }

// Der Prozessor läuft im eigenen Audio-Thread. Er wird als Blob-Modul
// geladen, damit alles in EINER HTML-Datei bleibt (kein separates File nötig).
const FM_WORKLET_SRC = `
class FMVoiceProcessor extends AudioWorkletProcessor {
  constructor(options){
    super();
    const o = options.processorOptions;
    this.startFrame = Math.round(o.startTime * sampleRate);
    this.baseFreq = o.baseFreq;
    this.pitchEndMult = (o.pitchEndMult != null) ? o.pitchEndMult : 1;
    this.pitchDecay = o.pitchDecay || 0;
    this.ops = o.ops;                // [{ratio, level, decay, feedback}], Index 0 = Carrier
    this.ampDecay = o.ampDecay;
    this.vol = o.vol;
    this.phases = this.ops.map(()=>0);
    this.fbMem = this.ops.map(()=>0);
    this.done = false;
  }
  process(inputs, outputs){
    const out = outputs[0];
    const ch0 = out[0];
    const n = ch0.length;
    const dt = 1 / sampleRate;
    for(let i=0;i<n;i++){
      const frame = currentFrame + i;
      if(frame < this.startFrame){ ch0[i]=0; continue; }
      const local = (frame - this.startFrame) / sampleRate;
      if(local > this.ampDecay + 0.06){ ch0[i]=0; this.done = true; continue; }
      const pitchMult = this.pitchDecay > 0
        ? this.pitchEndMult + (1 - this.pitchEndMult) * Math.exp(-local / this.pitchDecay)
        : 1;
      const f0 = this.baseFreq * pitchMult;
      let modPhaseAdd = 0;
      for(let idx = this.ops.length - 1; idx >= 1; idx--){
        const op = this.ops[idx];
        const freq = f0 * op.ratio;
        const env = Math.exp(-local / op.decay);
        const fb = op.feedback ? this.fbMem[idx] * op.feedback : 0;
        const s = Math.sin(this.phases[idx] + modPhaseAdd + fb);
        this.fbMem[idx] = s;
        this.phases[idx] += 2 * Math.PI * freq * dt;
        modPhaseAdd = s * op.level * env;
      }
      const carrier = this.ops[0];
      const freqC = f0 * carrier.ratio;
      const envC = Math.exp(-local / carrier.decay);
      const fbC = carrier.feedback ? this.fbMem[0] * carrier.feedback : 0;
      const sC = Math.sin(this.phases[0] + modPhaseAdd + fbC);
      this.fbMem[0] = sC;
      this.phases[0] += 2 * Math.PI * freqC * dt;
      const ampEnv = Math.exp(-local / this.ampDecay);
      ch0[i] = sC * envC * ampEnv * this.vol;
    }
    for(let c=1;c<out.length;c++) out[c].set(ch0);
    return !this.done;
  }
}
registerProcessor('fm-voice', FMVoiceProcessor);
`;

// Zweiter Worklet-Prozessor: reines Sample-Capturing. Reicht jeden
// Input-Block roh (Float32) an den Main-Thread weiter — Verarbeitung
// (Zusammensetzen zu einem AudioBuffer) passiert dort, da der Worklet-
// Scope selbst keinen persistenten Speicher über die Aufnahme hinweg halten muss.
const MIC_RECORDER_SRC = `
class MicRecorderProcessor extends AudioWorkletProcessor {
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if(ch && ch.length) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('mic-recorder', MicRecorderProcessor);
`;
let micWorkletReady=null, useMicWorklet=false;

function initAudio(){
  if(workletReady) return workletReady;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  comp = audioCtx.createDynamicsCompressor();
  master = audioCtx.createGain(); master.gain.value=0.85;
  master.connect(comp); comp.connect(audioCtx.destination);
  noiseBuf = makeNoise(2);

  // ---- Hall-Bus: eine gemeinsame Impulsantwort (synthetisch erzeugtes
  // Rauschen mit exponentiellem Decay), jede Spur schickt einen variablen
  // Anteil ihres Signals über einen eigenen Send-Gain dorthin.
  reverbInputNode = audioCtx.createGain();
  reverbConvolver = audioCtx.createConvolver();
  reverbConvolver.buffer = createImpulseResponse(2.4, 2.8);
  reverbInputNode.connect(reverbConvolver);
  reverbConvolver.connect(master);
  ensureTrackBuses();

  // AudioWorklet braucht einen sicheren Kontext (https/localhost) und
  // Browser-Unterstützung. Wenn nicht verfügbar, fällt die App automatisch
  // auf eine Node-basierte FM-Näherung zurück, statt stumm zu bleiben.
  if(audioCtx.audioWorklet){
    const blob = new Blob([FM_WORKLET_SRC], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    workletReady = audioCtx.audioWorklet.addModule(url)
      .then(()=>{ useWorklet=true; })
      .catch((err)=>{ console.warn('AudioWorklet nicht verfügbar, nutze Fallback:', err); useWorklet=false; });

    const micBlob = new Blob([MIC_RECORDER_SRC], {type:'application/javascript'});
    const micUrl = URL.createObjectURL(micBlob);
    micWorkletReady = audioCtx.audioWorklet.addModule(micUrl)
      .then(()=>{ useMicWorklet=true; })
      .catch((err)=>{ console.warn('Mic-Recorder-Worklet nicht verfügbar, nutze MediaRecorder-Fallback:', err); useMicWorklet=false; });
  } else {
    useWorklet=false; useMicWorklet=false;
    workletReady = Promise.resolve();
    micWorkletReady = Promise.resolve();
  }
  return Promise.all([workletReady, micWorkletReady]);
}
function makeNoise(dur){
  const n=audioCtx.sampleRate*dur;
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return buf;
}
function freqFromTune(base,tune){ const semis=(tune-0.5)*24; return base*Math.pow(2,semis/12); }

// Startet eine FM-Stimme im Audio-Thread; optional durch einen nativen
// Filter geformt, bevor sie auf den Master trifft.
function fmTrigger(time, cfg){
  if(!audioCtx) return;
  if(useWorklet){
    const node = new AudioWorkletNode(audioCtx, 'fm-voice', {
      numberOfInputs:0, numberOfOutputs:1, outputChannelCount:[1],
      processorOptions: Object.assign({startTime:time}, cfg)
    });
    let tail = node;
    if(cfg.filter){
      const f = audioCtx.createBiquadFilter();
      f.type = cfg.filter.type; f.frequency.value = cfg.filter.freq; if(cfg.filter.q) f.Q.value = cfg.filter.q;
      node.connect(f); tail = f;
    }
    tail.connect(getBus());
    const lifeMs = Math.max(50, (cfg.ampDecay+0.15)*1000 + (time-audioCtx.currentTime)*1000);
    setTimeout(()=>{ try{ node.disconnect(); if(tail!==node) tail.disconnect(); }catch(e){} }, lifeMs);
  } else {
    nativeFmTrigger(time, cfg);
  }
}

// Fallback ohne AudioWorklet: gleiche Operator-Struktur (Ratio/Level/Decay je
// Operator), aber als Kette aus OscillatorNode + GainNode nachgebaut. Jeder
// Modulator moduliert per Audio-Rate-Verbindung die Frequenz des jeweils
// nächst-inneren Operators. Feedback-Loops sind ohne Worklet nicht sample-
// genau möglich und werden hier weggelassen — klanglich sehr nah dran,
// aber ohne das chaotische Feedback-Rauschen der Worklet-Variante.
function nativeFmTrigger(time, cfg){
  const ops = cfg.ops;
  const nodes = ops.map(()=>{ const o=audioCtx.createOscillator(); o.type='sine'; return o; });

  const carrierOp = ops[0];
  const fStart = cfg.baseFreq*carrierOp.ratio;
  nodes.forEach((o,idx)=>{
    const f0 = cfg.baseFreq*ops[idx].ratio;
    o.frequency.setValueAtTime(f0, time);
  });
  if(cfg.pitchDecay){
    nodes.forEach((o,idx)=>{
      const fEnd = Math.max(1, cfg.baseFreq*cfg.pitchEndMult*ops[idx].ratio);
      o.frequency.exponentialRampToValueAtTime(fEnd, time+cfg.pitchDecay);
    });
  }

  for(let idx=ops.length-1; idx>=1; idx--){
    const op=ops[idx];
    const modGain=audioCtx.createGain();
    const depthHz = op.level * cfg.baseFreq * op.ratio * 0.6;
    modGain.gain.setValueAtTime(depthHz, time);
    modGain.gain.exponentialRampToValueAtTime(0.001, time+op.decay);
    nodes[idx].connect(modGain).connect(nodes[idx-1].frequency);
  }

  const amp=audioCtx.createGain();
  amp.gain.setValueAtTime(cfg.vol, time);
  amp.gain.exponentialRampToValueAtTime(0.001, time+cfg.ampDecay);
  nodes[0].connect(amp);

  let tail=amp;
  if(cfg.filter){
    const f=audioCtx.createBiquadFilter();
    f.type=cfg.filter.type; f.frequency.value=cfg.filter.freq; if(cfg.filter.q) f.Q.value=cfg.filter.q;
    amp.connect(f); tail=f;
  }
  tail.connect(getBus());
  const stopAt=time+cfg.ampDecay+0.08;
  nodes.forEach(o=>{ o.start(time); o.stop(stopAt); });
}

function playKick(time,vol,tune,accent,kp){
  const g=accent?1.3:1;
  const base=freqFromTune(kp.baseFreq,tune);
  fmTrigger(time, {
    baseFreq: base*kp.startMult, pitchEndMult: kp.pitchEndMult, pitchDecay: kp.pitchDecay,
    ops: kp.ops, ampDecay: kp.ampDecay, vol: vol*g
  });
  if(kp.clickLevel>0){
    const click=audioCtx.createOscillator(); click.type='square'; click.frequency.value=900;
    const cg=audioCtx.createGain();
    cg.gain.setValueAtTime(kp.clickLevel*vol*g,time); cg.gain.exponentialRampToValueAtTime(0.001,time+0.018);
    click.connect(cg).connect(getBus()); click.start(time); click.stop(time+0.02);
  }
}

function playSnare(time,vol,tune,accent,kp){
  const g=accent?1.3:1;
  fmTrigger(time, {
    baseFreq: freqFromTune(kp.baseFreq,tune),
    ops: kp.ops, ampDecay: kp.ampDecay, vol: kp.fmLevel*vol*g
  });
  const noise=audioCtx.createBufferSource(); noise.buffer=noiseBuf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=kp.noiseFreqBase+tune*kp.noiseFreqTune; bp.Q.value=kp.noiseQ;
  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(kp.noiseLevel*vol*g,time); ng.gain.exponentialRampToValueAtTime(0.01,time+kp.noiseDecay);
  noise.connect(bp).connect(ng).connect(getBus()); noise.start(time); noise.stop(time+kp.noiseDecay+0.02);
}

function playTom(time,vol,tune,accent,kp){
  const g=accent?1.3:1;
  const base=freqFromTune(kp.baseFreq,tune);
  fmTrigger(time, {
    baseFreq: base*kp.startMult, pitchEndMult: kp.pitchEndMult, pitchDecay: kp.pitchDecay,
    ops: kp.ops, ampDecay: kp.ampDecay, vol: vol*g
  });
}

function playRim(time,vol,tune,accent,kp){
  const g=accent?1.3:1;
  fmTrigger(time, {
    baseFreq: freqFromTune(kp.baseFreq,tune),
    ops: kp.ops, ampDecay: kp.ampDecay, vol: kp.fmLevel*vol*g
  });
  if(kp.clickLevel>0){
    const noise=audioCtx.createBufferSource(); noise.buffer=noiseBuf;
    const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=kp.clickFreq;
    const ng=audioCtx.createGain();
    ng.gain.setValueAtTime(kp.clickLevel*vol*g,time); ng.gain.exponentialRampToValueAtTime(0.001,time+0.025);
    noise.connect(hp).connect(ng).connect(getBus()); noise.start(time); noise.stop(time+0.03);
  }
}

function playClap(time,vol,tune,accent,kp){
  const g=accent?1.3:1;
  const centerF=kp.centerFreqBase+tune*kp.centerFreqTune;
  kp.bursts.forEach((offset,i,arr)=>{
    const noise=audioCtx.createBufferSource(); noise.buffer=noiseBuf;
    const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=centerF; bp.Q.value=1.4;
    const ng=audioCtx.createGain();
    const last=i===arr.length-1;
    const peak= last? 0.55*vol*g : 0.4*vol*g;
    const decay= last? 0.22 : 0.03;
    ng.gain.setValueAtTime(peak,time+offset);
    ng.gain.exponentialRampToValueAtTime(0.001,time+offset+decay);
    noise.connect(bp).connect(ng).connect(getBus());
    noise.start(time+offset); noise.stop(time+offset+decay+0.02);
  });
}

// Hi-Hats: FM mit Feedback statt additiver Oszillator-Bank —
// Feedback-Operatoren erzeugen ein chaotisches, metallisch-rauschiges Spektrum.
function playHat(time,vol,tune,accent,kp,open){
  const g=accent?1.25:1;
  const base = open ? (accent?kp.decayOpenAccent:kp.decayOpen) : (accent?kp.decayClosedAccent:kp.decayClosed);
  fmTrigger(time, {
    baseFreq: freqFromTune(kp.baseFreq,tune),
    ops: kp.ops.map(o=>({ratio:o.ratio, level:o.level, decay:o.decay*(base/kp.decayClosed), feedback:o.feedback})),
    ampDecay: base, vol: kp.fmLevel*vol*g,
    filter: {type:kp.filterType||'highpass', freq:kp.filterFreq}
  });
}

function playCrash(time,vol,tune,accent,kp){
  const g=accent?1.25:1;
  fmTrigger(time, {
    baseFreq: freqFromTune(kp.baseFreq,tune),
    ops: kp.ops, ampDecay: kp.ampDecay, vol: kp.fmLevel*vol*g,
    filter: {type:kp.filterType||'highpass', freq:kp.filterFreq}
  });
  const noise=audioCtx.createBufferSource(); noise.buffer=noiseBuf;
  const hp=audioCtx.createBiquadFilter(); hp.type=kp.filterType||'highpass'; hp.frequency.value=kp.filterFreq+1200;
  const gain=audioCtx.createGain();
  gain.gain.setValueAtTime(kp.noiseLevel*vol*g,time); gain.gain.exponentialRampToValueAtTime(0.001,time+kp.noiseDecay);
  noise.connect(hp).connect(gain).connect(getBus()); noise.start(time); noise.stop(time+kp.noiseDecay+0.05);
}

// =========================================================================
// MIC-SAMPLE — aufgenommener Sound als eigene Spur (kein FM-Preset)
// =========================================================================
let sampleBuffer=null; // AudioBuffer des zuletzt aufgenommenen Samples
let sampleStartOffset=0; // Trim-Startpunkt in Sekunden

function playSample(time,vol,tune,accent){
  if(!sampleBuffer || !audioCtx) return;
  const g=accent?1.25:1;
  const src=audioCtx.createBufferSource();
  src.buffer=sampleBuffer;
  // tune (0..1) steuert die Playback-Rate: 0.5x .. 2x, Mitte = Originaltonhöhe
  src.playbackRate.value=Math.pow(2,(tune-0.5)*2);
  const g2=audioCtx.createGain();
  g2.gain.value=vol*g;
  src.connect(g2).connect(getBus());
  const offset=Math.min(sampleStartOffset, Math.max(0, sampleBuffer.duration-0.01));
  src.start(time, offset);
}

function makeKnob({label, min, max, value, size, fmt, onChange}){
  const wrap=document.createElement('div'); wrap.className='knob';
  const dial=document.createElement('div'); dial.className='knob-dial';
  if(size) dial.style.setProperty('--ks', size);
  const ind=document.createElement('div'); ind.className='ind';
  dial.appendChild(ind); wrap.appendChild(dial);
  if(label){ const l=document.createElement('div'); l.className='knob-label'; l.textContent=label; wrap.appendChild(l); }
  const valEl=document.createElement('div'); valEl.className='knob-val'; wrap.appendChild(valEl);

  let val=value;
  function render(){
    const t=(val-min)/(max-min);
    ind.style.transform=`rotate(${-135+t*270}deg)`;
    valEl.textContent = fmt ? fmt(val) : val.toFixed(2);
  }
  render();
  let dragging=false, startY=0, startVal=0;
  function onDown(e){ dragging=true; startY=(e.touches?e.touches[0].clientY:e.clientY); startVal=val; e.preventDefault(); }
  function onMove(e){
    if(!dragging) return;
    const y=(e.touches?e.touches[0].clientY:e.clientY);
    val=Math.min(max,Math.max(min, startVal+((startY-y)/130)*(max-min)));
    render(); onChange && onChange(val);
    e.preventDefault && e.preventDefault();
  }
  function onUp(){ dragging=false; }
  dial.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  dial.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);
  return { el:wrap, setValue(v){ val=v; render(); } };
}

// =========================================================================
// MIC-SAMPLE — Aufnahme (getUserMedia → AudioWorklet-Capture → AudioBuffer)
// mit MediaRecorder-Fallback, falls AudioWorklet nicht verfügbar ist.
// Persistenz optional über IndexedDB (überlebt Reload, pro Browser/Origin).
// =========================================================================
const MAX_REC_SECONDS=4;
let micStream=null, micSourceNode=null, micRecorderNode=null, micSilentGain=null;
let mediaRecorder=null, mediaChunks=[];
let isRecording=false, recChunksFloat=[], recStartTime=0, recTimerId=null;

const recBtn=document.getElementById('recBtn');
const recStatus=document.getElementById('recStatus');
const sampleClearBtn=document.getElementById('sampleClearBtn');
const samplePreviewBtn=document.getElementById('samplePreviewBtn');
const trimBtn=document.getElementById('trimBtn');

function updateRecStatus(){
  if(isRecording) return; // während Aufnahme übernimmt der Timer die Anzeige
  if(sampleBuffer){
    recStatus.textContent=sampleBuffer.duration.toFixed(1)+'s';
    recStatus.classList.remove('err');
    sampleClearBtn.style.display='';
    samplePreviewBtn.style.display='';
    trimBtn.style.display='';
  } else {
    const inIframe=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
    recStatus.textContent = inIframe ? 'Vorschau: kein Mic' : 'kein Sample';
    if(inIframe) recBtn.title='In dieser Vorschau blockiert — Datei herunterladen & lokal öffnen';
    sampleClearBtn.style.display='none';
    samplePreviewBtn.style.display='none';
    trimBtn.style.display='none';
  }
}

async function ensureMicStream(){
  if(micStream) return micStream;
  micStream = await navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
  });
  return micStream;
}

function micErrorMessage(err){
  const inIframe = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return inIframe ? 'Vorschau blockiert Mikro' : 'Browser unterstützt kein Mic-Recording';
  }
  switch(err && err.name){
    case 'NotAllowedError':
      return inIframe ? 'Vorschau blockiert Mikro' : 'Zugriff abgelehnt — Browser-Einstellungen prüfen';
    case 'NotFoundError':
      return 'Kein Mikrofon gefunden';
    case 'NotReadableError':
      return 'Mikro von anderer App belegt';
    case 'SecurityError':
      return 'Nur über HTTPS/localhost möglich';
    default:
      return inIframe ? 'Vorschau blockiert Mikro' : 'Mikro-Zugriff fehlgeschlagen';
  }
}

async function startRecording(){
  try{
    await Promise.resolve(initAudio());
    if(audioCtx.state==='suspended') await audioCtx.resume();
    await ensureMicStream();
  } catch(err){
    console.warn('Mikrofonzugriff fehlgeschlagen:', err);
    recStatus.textContent=micErrorMessage(err);
    recStatus.classList.add('err');
    return;
  }

  isRecording=true;
  recStartTime=audioCtx.currentTime;
  recBtn.textContent='■ Stop';
  recBtn.classList.add('recording');
  recStatus.classList.remove('err');
  recTimerId=setInterval(()=>{
    const el=(audioCtx.currentTime-recStartTime);
    recStatus.textContent=el.toFixed(1)+'s';
    if(el>=MAX_REC_SECONDS) stopRecording();
  }, 100);

  micSourceNode=audioCtx.createMediaStreamSource(micStream);

  if(useMicWorklet){
    recChunksFloat=[];
    micRecorderNode=new AudioWorkletNode(audioCtx,'mic-recorder',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
    micRecorderNode.port.onmessage=(e)=>{ recChunksFloat.push(e.data); };
    micSilentGain=audioCtx.createGain(); micSilentGain.gain.value=0; // hörbares Monitoring vermeiden (kein Feedback)
    micSourceNode.connect(micRecorderNode).connect(micSilentGain).connect(audioCtx.destination);
  } else {
    // Fallback ohne AudioWorklet: MediaRecorder liefert komprimierte Chunks,
    // die nach Aufnahmeende per decodeAudioData zu einem AudioBuffer werden.
    mediaChunks=[];
    mediaRecorder=new MediaRecorder(micStream);
    mediaRecorder.ondataavailable=(e)=>{ if(e.data.size>0) mediaChunks.push(e.data); };
    mediaRecorder.start();
  }
}

async function stopRecording(){
  if(!isRecording) return;
  isRecording=false;
  clearInterval(recTimerId);
  recBtn.textContent='● Rec';
  recBtn.classList.remove('recording');

  if(useMicWorklet){
    micSourceNode.disconnect(); micRecorderNode.disconnect(); micSilentGain.disconnect();
    const totalLen=recChunksFloat.reduce((s,c)=>s+c.length,0);
    if(totalLen===0){ updateRecStatus(); return; }
    const data=new Float32Array(totalLen);
    let off=0;
    for(const c of recChunksFloat){ data.set(c,off); off+=c.length; }
    const buf=audioCtx.createBuffer(1,totalLen,audioCtx.sampleRate);
    buf.copyToChannel(data,0);
    sampleBuffer=buf;
    sampleStartOffset=0;
    updateRecStatus();
    saveSampleToIndexedDB(buf);
  } else {
    await new Promise(resolve=>{
      mediaRecorder.onstop=resolve;
      mediaRecorder.stop();
    });
    micSourceNode.disconnect();
    const blob=new Blob(mediaChunks,{type:mediaChunks[0]?.type||'audio/webm'});
    const arr=await blob.arrayBuffer();
    try{
      sampleBuffer=await audioCtx.decodeAudioData(arr);
      sampleStartOffset=0;
      updateRecStatus();
      saveSampleToIndexedDB(sampleBuffer);
    } catch(err){
      console.warn('Sample konnte nicht dekodiert werden:', err);
      recStatus.textContent='Fehler beim Dekodieren';
      recStatus.classList.add('err');
    }
  }
}

// ---- WAV-Encoding (für IndexedDB-Speicherung als Blob) ----
function audioBufferToWavBlob(buffer){
  const numCh=buffer.numberOfChannels, sr=buffer.sampleRate, len=buffer.length;
  const bytesPerSample=2, blockAlign=numCh*bytesPerSample;
  const dataSize=len*blockAlign;
  const ab=new ArrayBuffer(44+dataSize);
  const dv=new DataView(ab);
  const writeStr=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  writeStr(0,'RIFF'); dv.setUint32(4,36+dataSize,true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true);
  dv.setUint16(22,numCh,true); dv.setUint32(24,sr,true);
  dv.setUint32(28,sr*blockAlign,true); dv.setUint16(32,blockAlign,true); dv.setUint16(34,16,true);
  writeStr(36,'data'); dv.setUint32(40,dataSize,true);
  let off=44;
  const chans=[]; for(let c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
  for(let i=0;i<len;i++){
    for(let c=0;c<numCh;c++){
      const s=Math.max(-1,Math.min(1,chans[c][i]));
      dv.setInt16(off, s<0? s*0x8000 : s*0x7fff, true); off+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}

// ---- IndexedDB-Persistenz (optional, überlebt Reload) ----
const IDB_NAME='RM909SampleDB', IDB_STORE='samples', IDB_KEY='micSample', IDB_PATTERNS='patterns';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_NAME,2);
    req.onupgradeneeded=(e)=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(IDB_PATTERNS)) db.createObjectStore(IDB_PATTERNS);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveSampleToIndexedDB(buffer){
  try{
    const blob=audioBufferToWavBlob(buffer);
    const db=await idbOpen();
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({blob, offset:sampleStartOffset}, IDB_KEY);
  } catch(err){ console.warn('IndexedDB-Speicherung fehlgeschlagen:', err); }
}
async function saveTrimOffsetToIndexedDB(){
  try{
    if(!sampleBuffer) return;
    const blob=audioBufferToWavBlob(sampleBuffer);
    const db=await idbOpen();
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({blob, offset:sampleStartOffset}, IDB_KEY);
  } catch(err){ console.warn('IndexedDB-Speicherung (Offset) fehlgeschlagen:', err); }
}
async function deleteSampleFromIndexedDB(){
  try{
    const db=await idbOpen();
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
  } catch(err){ console.warn('IndexedDB-Löschung fehlgeschlagen:', err); }
}
async function loadSampleFromIndexedDB(){
  try{
    const db=await idbOpen();
    const tx=db.transaction(IDB_STORE,'readonly');
    const rec=await new Promise((res,rej)=>{
      const r=tx.objectStore(IDB_STORE).get(IDB_KEY);
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    if(!rec) return;
    await Promise.resolve(initAudio());
    const blobData = (rec instanceof Blob) ? rec : rec.blob;
    const arr=await blobData.arrayBuffer();
    sampleBuffer=await audioCtx.decodeAudioData(arr);
    sampleStartOffset = (rec instanceof Blob) ? 0 : (rec.offset || 0);
    if(TRACKS[activeTrackIdx].isSample) updateRecStatus();
  } catch(err){ console.warn('Kein gespeichertes Sample gefunden oder Fehler beim Laden:', err); }
}

// SAMPLE-TRIM-EDITOR — Wellenform + ziehbarer Startpunkt
// =========================================================================
const trimPanel=document.getElementById('trimPanel');
const trimCanvas=document.getElementById('trimCanvas');
const trimCtx=trimCanvas.getContext('2d');
const trimCanvasWrap=document.getElementById('trimCanvasWrap');
const trimHandle=document.getElementById('trimHandle');
const trimDim=document.getElementById('trimDim');
const trimLabel=document.getElementById('trimLabel');
const trimPreviewBtn=document.getElementById('trimPreviewBtn');
const trimApplyBtn=document.getElementById('trimApplyBtn');
const trimCancelBtn=document.getElementById('trimCancelBtn');
let trimDraftOffset=0; // Arbeitskopie, erst bei "Übernehmen" scharf geschaltet
let trimPreviewSrc=null;

function drawWaveform(){
  const w=trimCanvasWrap.clientWidth, h=trimCanvasWrap.clientHeight;
  trimCanvas.width=w*devicePixelRatio; trimCanvas.height=h*devicePixelRatio;
  trimCanvas.style.width=w+'px'; trimCanvas.style.height=h+'px';
  trimCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  trimCtx.clearRect(0,0,w,h);
  if(!sampleBuffer) return;
  const data=sampleBuffer.getChannelData(0);
  const step=Math.max(1, Math.floor(data.length/w));
  trimCtx.strokeStyle='#3fa9ff';
  trimCtx.lineWidth=1;
  trimCtx.beginPath();
  const mid=h/2;
  for(let x=0;x<w;x++){
    let min=1,max=-1;
    const start=x*step;
    for(let i=0;i<step;i++){
      const s=data[start+i]; if(s===undefined) break;
      if(s<min) min=s; if(s>max) max=s;
    }
    trimCtx.moveTo(x, mid+min*mid*0.9);
    trimCtx.lineTo(x, mid+max*mid*0.9);
  }
  trimCtx.stroke();
}
function updateTrimUI(){
  const w=trimCanvasWrap.clientWidth;
  const dur=sampleBuffer ? sampleBuffer.duration : 1;
  const t=Math.min(1, Math.max(0, trimDraftOffset/dur));
  const x=t*w;
  trimHandle.style.left=x+'px';
  trimDim.style.width=x+'px';
  trimLabel.textContent='Start: '+trimDraftOffset.toFixed(2)+'s';
}
function openTrimEditor(){
  if(!sampleBuffer) return;
  trimDraftOffset=sampleStartOffset;
  trimPanel.classList.add('open');
  requestAnimationFrame(()=>{ drawWaveform(); updateTrimUI(); });
}
function closeTrimEditor(){
  trimPanel.classList.remove('open');
  if(trimPreviewSrc){ try{ trimPreviewSrc.stop(); }catch(e){} trimPreviewSrc=null; }
}
trimBtn.addEventListener('click', openTrimEditor);
trimCancelBtn.addEventListener('click', closeTrimEditor);
trimApplyBtn.addEventListener('click', ()=>{
  sampleStartOffset=trimDraftOffset;
  closeTrimEditor();
  saveTrimOffsetToIndexedDB();
});
trimPreviewBtn.addEventListener('click', ()=>{
  if(!sampleBuffer || !audioCtx) return;
  if(trimPreviewSrc){ try{ trimPreviewSrc.stop(); }catch(e){} }
  trimPreviewSrc=audioCtx.createBufferSource();
  trimPreviewSrc.buffer=sampleBuffer;
  trimPreviewSrc.connect(master);
  const offset=Math.min(trimDraftOffset, Math.max(0, sampleBuffer.duration-0.01));
  trimPreviewSrc.start(audioCtx.currentTime, offset);
});

let trimDragging=false;
function trimSetFromX(clientX){
  const rect=trimCanvasWrap.getBoundingClientRect();
  const x=Math.min(rect.width, Math.max(0, clientX-rect.left));
  const dur=sampleBuffer ? sampleBuffer.duration : 1;
  trimDraftOffset=(x/rect.width)*dur;
  updateTrimUI();
}
function trimOnDown(e){ trimDragging=true; trimSetFromX(e.touches?e.touches[0].clientX:e.clientX); e.preventDefault(); }
function trimOnMove(e){ if(!trimDragging) return; trimSetFromX(e.touches?e.touches[0].clientX:e.clientX); e.preventDefault&&e.preventDefault(); }
function trimOnUp(){ trimDragging=false; }
trimCanvasWrap.addEventListener('pointerdown', trimOnDown);
window.addEventListener('pointermove', trimOnMove);
window.addEventListener('pointerup', trimOnUp);
trimCanvasWrap.addEventListener('touchstart', trimOnDown, {passive:false});
window.addEventListener('touchmove', trimOnMove, {passive:false});
window.addEventListener('touchend', trimOnUp);

// =========================================================================
// SAMPLE PAD — 9 unabhängige Live-Pads, eigenes Mikro-Sample pro Pad,
// getrennt vom Step-Sequencer (sofortiges Antippen statt Timing-Raster).
// =========================================================================
const PAD_COUNT=9;
const padSamples=Array.from({length:PAD_COUNT}, ()=>({buffer:null, offset:0}));
let padRecMode=false, padRecordingIndex=-1;
let padMicSourceNode=null, padMicRecorderNode=null, padMicSilentGain=null;
let padMediaRecorder=null, padMediaChunks=[];
let padRecChunksFloat=[], padRecStartTime=0, padRecTimerId=null;

const padGrid=document.getElementById('padGrid');
const padRecToggle=document.getElementById('padRecToggle');
const padEls=[];
for(let i=0;i<PAD_COUNT;i++){
  const el=document.createElement('div'); el.className='pad';
  const label=document.createElement('div'); label.className='plabel'; label.textContent='PAD '+(i+1);
  const stat=document.createElement('div'); stat.className='pstat'; stat.textContent='leer';
  el.appendChild(label); el.appendChild(stat);
  el.addEventListener('click', ()=>onPadTap(i));
  padGrid.appendChild(el);
  padEls.push({el, label, stat});
}
function updatePadUI(i){
  const {el, stat}=padEls[i]; const s=padSamples[i];
  if(s.buffer){ el.classList.add('filled'); stat.textContent=s.buffer.duration.toFixed(1)+'s'; }
  else { el.classList.remove('filled'); stat.textContent='leer'; }
}
padRecToggle.addEventListener('click', ()=>{
  padRecMode=!padRecMode;
  padRecToggle.classList.toggle('on', padRecMode);
  padRecToggle.textContent = padRecMode ? '⏺ Tippe ein Pad' : '⏺ Pads bespielen';
  if(!padRecMode && padRecordingIndex>=0) stopPadRecording();
});
async function onPadTap(i){
  if(padRecMode){
    if(padRecordingIndex===i){ stopPadRecording(); }
    else { if(padRecordingIndex>=0) await stopPadRecording(); startPadRecording(i); }
    return;
  }
  playPad(i);
}
function playPad(i){
  const s=padSamples[i];
  if(!s.buffer || !audioCtx) return;
  const src=audioCtx.createBufferSource(); src.buffer=s.buffer;
  const g=audioCtx.createGain(); g.gain.value=0.9;
  src.connect(g).connect(master);
  const offset=Math.min(s.offset, Math.max(0, s.buffer.duration-0.01));
  src.start(audioCtx.currentTime, offset);
  padEls[i].el.classList.add('flash');
  setTimeout(()=>padEls[i].el.classList.remove('flash'), 90);
}
async function startPadRecording(i){
  try{
    await Promise.resolve(initAudio());
    if(audioCtx.state==='suspended') await audioCtx.resume();
    await ensureMicStream();
  } catch(err){
    console.warn('Mikrofonzugriff (Pad) fehlgeschlagen:', err);
    padEls[i].stat.textContent=micErrorMessage(err);
    return;
  }
  padRecordingIndex=i;
  padRecStartTime=audioCtx.currentTime;
  padEls[i].el.classList.add('recording');
  padRecTimerId=setInterval(()=>{
    const el=(audioCtx.currentTime-padRecStartTime);
    padEls[i].stat.textContent=el.toFixed(1)+'s';
    if(el>=MAX_REC_SECONDS) stopPadRecording();
  }, 100);

  padMicSourceNode=audioCtx.createMediaStreamSource(micStream);
  if(useMicWorklet){
    padRecChunksFloat=[];
    padMicRecorderNode=new AudioWorkletNode(audioCtx,'mic-recorder',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});
    padMicRecorderNode.port.onmessage=(e)=>{ padRecChunksFloat.push(e.data); };
    padMicSilentGain=audioCtx.createGain(); padMicSilentGain.gain.value=0;
    padMicSourceNode.connect(padMicRecorderNode).connect(padMicSilentGain).connect(audioCtx.destination);
  } else {
    padMediaChunks=[];
    padMediaRecorder=new MediaRecorder(micStream);
    padMediaRecorder.ondataavailable=(e)=>{ if(e.data.size>0) padMediaChunks.push(e.data); };
    padMediaRecorder.start();
  }
}
async function stopPadRecording(){
  if(padRecordingIndex<0) return;
  const i=padRecordingIndex; padRecordingIndex=-1;
  clearInterval(padRecTimerId);
  padEls[i].el.classList.remove('recording');

  if(useMicWorklet){
    padMicSourceNode.disconnect(); padMicRecorderNode.disconnect(); padMicSilentGain.disconnect();
    const totalLen=padRecChunksFloat.reduce((s,c)=>s+c.length,0);
    if(totalLen===0){ updatePadUI(i); return; }
    const data=new Float32Array(totalLen);
    let off=0;
    for(const c of padRecChunksFloat){ data.set(c,off); off+=c.length; }
    const buf=audioCtx.createBuffer(1,totalLen,audioCtx.sampleRate);
    buf.copyToChannel(data,0);
    padSamples[i].buffer=buf; padSamples[i].offset=0;
    updatePadUI(i);
    savePadToIndexedDB(i, buf);
  } else {
    await new Promise(resolve=>{ padMediaRecorder.onstop=resolve; padMediaRecorder.stop(); });
    padMicSourceNode.disconnect();
    const blob=new Blob(padMediaChunks,{type:padMediaChunks[0]?.type||'audio/webm'});
    const arr=await blob.arrayBuffer();
    try{
      const buf=await audioCtx.decodeAudioData(arr);
      padSamples[i].buffer=buf; padSamples[i].offset=0;
      updatePadUI(i);
      savePadToIndexedDB(i, buf);
    } catch(err){
      console.warn('Pad-Sample konnte nicht dekodiert werden:', err);
      padEls[i].stat.textContent='Fehler';
    }
  }
}
async function savePadToIndexedDB(i, buffer){
  try{
    const blob=audioBufferToWavBlob(buffer);
    const db=await idbOpen();
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({blob, offset:0}, 'pad'+i);
  } catch(err){ console.warn('IndexedDB-Speicherung (Pad) fehlgeschlagen:', err); }
}
async function loadPadsFromIndexedDB(){
  for(let i=0;i<PAD_COUNT;i++){
    try{
      const db=await idbOpen();
      const tx=db.transaction(IDB_STORE,'readonly');
      const rec=await new Promise((res,rej)=>{
        const r=tx.objectStore(IDB_STORE).get('pad'+i);
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      });
      if(!rec) continue;
      await Promise.resolve(initAudio());
      const blobData=(rec instanceof Blob) ? rec : rec.blob;
      const arr=await blobData.arrayBuffer();
      const buf=await audioCtx.decodeAudioData(arr);
      padSamples[i].buffer=buf;
      padSamples[i].offset=(rec instanceof Blob) ? 0 : (rec.offset||0);
      updatePadUI(i);
    } catch(err){ /* kein gespeichertes Pad-Sample vorhanden */ }
  }
}

// PATTERN-SPEICHER — kompletter Beat-Zustand (Steps, Kit, Tempo, Hall, …)
// als benannte Sätze in IndexedDB, session-übergreifend abrufbar.

function collectPatternData(name){
  return {
    name,
    savedAt: Date.now(),
    bpm, swing,
    kitId: currentKitId,
    accentSteps: accentSteps.slice(),
    tracks: TRACKS.map(tr=>({
      id: tr.id,
      steps: tr.steps.slice(),
      vol: tr.vol,
      tune: tr.tune,
      reverbAmount: tr.reverbAmount || 0
    }))
  };
}
function applyPatternData(data){
  bpm=data.bpm; swing=data.swing;
  lcdBpm.textContent=Math.round(bpm)+' BPM';
  globalKnobs.innerHTML='';
  [
    makeKnob({label:'TEMPO', min:60, max:200, value:bpm, fmt:v=>Math.round(v), onChange:v=>{bpm=v; lcdBpm.textContent=Math.round(v)+' BPM';}}),
    makeKnob({label:'SWING', min:0, max:0.6, value:swing, fmt:v=>Math.round(v/0.6*100)+'%', onChange:v=>swing=v}),
    makeKnob({label:'VOLUME', min:0, max:1, value:masterVol, fmt:v=>Math.round(v*100)+'%', onChange:v=>{masterVol=v; if(master) master.gain.value=v;}}),
  ].forEach(k=>globalKnobs.appendChild(k.el));

  if(KITS[data.kitId]){
    currentKitId=data.kitId;
    document.querySelectorAll('.kit-chip').forEach(c=>c.classList.remove('active'));
    KITS[data.kitId]._chip.classList.add('active');
    lcdKit.textContent=KITS[data.kitId].name;
  }

  accentSteps.splice(0,16,...data.accentSteps);
  data.tracks.forEach(saved=>{
    const tr=TRACKS.find(t=>t.id===saved.id);
    if(!tr) return;
    tr.steps.splice(0,16,...saved.steps);
    tr.vol=saved.vol; tr.tune=saved.tune; tr.reverbAmount=saved.reverbAmount||0;
    if(tr.sendGain) tr.sendGain.gain.value=tr.reverbAmount;
    tr._ovCells.forEach((c,s)=>c.classList.toggle('on', tr.steps[s]));
  });
  selectTrack(activeTrackIdx);
}
async function savePatternToIndexedDB(data){
  const db=await idbOpen();
  const tx=db.transaction(IDB_PATTERNS,'readwrite');
  tx.objectStore(IDB_PATTERNS).put(data, data.name);
}
async function loadPatternFromIndexedDB(name){
  const db=await idbOpen();
  const tx=db.transaction(IDB_PATTERNS,'readonly');
  return new Promise((res,rej)=>{
    const r=tx.objectStore(IDB_PATTERNS).get(name);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function deletePatternFromIndexedDB(name){
  const db=await idbOpen();
  const tx=db.transaction(IDB_PATTERNS,'readwrite');
  tx.objectStore(IDB_PATTERNS).delete(name);
}
async function listPatternsFromIndexedDB(){
  const db=await idbOpen();
  const tx=db.transaction(IDB_PATTERNS,'readonly');
  return new Promise((res,rej)=>{
    const out=[];
    const req=tx.objectStore(IDB_PATTERNS).openCursor();
    req.onsuccess=(e)=>{
      const cursor=e.target.result;
      if(cursor){ out.push(cursor.value); cursor.continue(); }
      else res(out.sort((a,b)=>b.savedAt-a.savedAt));
    };
    req.onerror=()=>rej(req.error);
  });
}

// =========================================================================
// SCHEDULER (Lookahead-Pattern)
// =========================================================================
let isPlaying=false, currentStep=0, nextNoteTime=0;
const scheduleAheadTime=0.12, lookahead=25;
let timerID=null, scheduledSteps=[];
const lcdStep=document.getElementById('lcdStep');
const playBtn=document.getElementById('playBtn'), powerLed=document.getElementById('powerLed');

function stepDuration(){ return 60/bpm/4; }
function scheduleStep(step,time){
  scheduledSteps.push({step,time});
  const accent=accentSteps[step];
  TRACKS.forEach(tr=>{ if(tr.steps[step] && !tr.muted) triggerTrack(tr, time, accent); });
}
function scheduler(){
  while(nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
    scheduleStep(currentStep, nextNoteTime);
    let dur=stepDuration();
    if(currentStep%2===1) dur += stepDuration()*swing;
    nextNoteTime += dur;
    currentStep=(currentStep+1)%16;
  }
  timerID=setTimeout(scheduler, lookahead);
}
function start(){
  Promise.resolve(initAudio()).then(()=>{
    if(audioCtx.state==='suspended') audioCtx.resume();
    isPlaying=true; currentStep=0; nextNoteTime=audioCtx.currentTime+0.06; scheduledSteps=[];
    scheduler();
    playBtn.textContent='■'; playBtn.classList.add('playing'); powerLed.classList.add('on');
    requestAnimationFrame(visualLoop);
  });
}
function stop(){
  isPlaying=false; clearTimeout(timerID);
  playBtn.textContent='▶'; playBtn.classList.remove('playing'); powerLed.classList.remove('on');
  document.querySelectorAll('.playcol').forEach(el=>el.classList.remove('playcol'));
}
playBtn.addEventListener('click', ()=> isPlaying ? stop() : start());

let lastDisplayStep=-1;
function visualLoop(){
  if(!isPlaying) return;
  requestAnimationFrame(visualLoop);
  const now=audioCtx.currentTime;
  while(scheduledSteps.length && scheduledSteps[0].time<=now){
    const ev=scheduledSteps.shift();
    if(ev.step!==lastDisplayStep){
      document.querySelectorAll('.playcol').forEach(el=>el.classList.remove('playcol'));
      TRACKS.forEach(tr=> tr._ovCells[ev.step].classList.add('playcol'));
      bigCells[ev.step].classList.add('playcol');
      if(TRACKS[activeTrackIdx].steps[ev.step]){
        bigCells[ev.step].classList.add('flash');
        setTimeout(()=>bigCells[ev.step].classList.remove('flash'),90);
      }
      lcdStep.textContent='STEP '+String(ev.step+1).padStart(2,'0')+'/16';
      lastDisplayStep=ev.step;
    }
  }
}

// STANDARD-PATTERN

(function seedPattern(){
  const bd=TRACKS[0], sd=TRACKS[1], ch=TRACKS[6], oh=TRACKS[7];
  [0,8].forEach(s=>bd.steps[s]=true);
  [4,12].forEach(s=>sd.steps[s]=true);
  [0,2,4,6,8,10,12,14].forEach(s=>ch.steps[s]=true);
  oh.steps[15]=true;
  accentSteps[0]=true; accentSteps[8]=true;
  TRACKS.forEach(tr=> tr._ovCells.forEach((c,s)=>c.classList.toggle('on', tr.steps[s])));
  selectTrack(0);
})();

loadSampleFromIndexedDB();
loadPadsFromIndexedDB();

})();
