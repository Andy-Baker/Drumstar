<template id="notes">
  <h3>Was das ist</h3>
  <p>Die <b>echte App</b>. <b>Öffnen</b> legt eine Sampler-Spur an und öffnet <b>Sound wählen</b>. Unter <b>Eigene</b> neu: das Beispiel <b>GITARRE</b> (eigenes Instrument) und <b>+ Instrument bauen</b>. Beides öffnet das Fenster <b>Instrument bauen</b>.</p>
  <p>Das Beispiel ist gespielt: 7 Töne, beim C3 drei Lautstärken. Klang im Mockup = Pizzicato als Platzhalter, Aufnehmen ist nur angedeutet.</p>
  <h3>Idee</h3>
  <ul>
    <li>Instrument = mehrere Samples aus der Bibliothek, je Sample <b>Grundton</b> (erkannt, −/+) und <b>Stufe</b> leise · mittel · laut.</li>
    <li><b>Bereiche ergeben sich selbst</b>: jeder Ton gilt bis zur Mitte zum Nachbarn. Gleicher Ton + gleiche Stufe = Varianten (abwechselnd).</li>
    <li><b>Tonleiter aufnehmen</b>: mehrere Töne am Stück einspielen, wird an den Anschlägen geschnitten und gestimmt.</li>
    <li>Optional: Lautheit je Ton angleichen. Im Sampler wie ein Werk-Instrument wählbar.</li>
  </ul>
  <h3>Varianten</h3>
  <ul>
    <li><b>A · Tastatur</b>: Klaviatur mit farbigen Bereichen darüber. Taste = anhören, Bereich = Ton bearbeiten (Stufen, Grundton) im Fenster von unten.</li>
    <li><b>B · Liste</b>: oben schmale Übersicht der Bereiche, darunter je Ton eine Karte mit den Samples und Stufen-Schalter L·M·L direkt in der Zeile.</li>
  </ul>
</template>

      +'<div class="rt"><span class="lbl" style="flex:1">Grundton</span><button data-d="-1">−</button><b>'+midiName(r)+'</b><button data-d="1">+</button><button class="btn" style="min-height:40px">Erkennen</button></div>'
      +[2,1,0].map(l=>{ const S=L.filter(x=>x.l===l); return '<div class="lv"><h4><span>'+LV[l]+'</span><span>'+(S.length>1?S.length+' Varianten, abwechselnd':S.length?'':'fehlt – nimmt nächste Stufe')+'</span></h4>'+S.map(srow).join('')+'<button class="add">+ Sample</button></div>'; }).join('')
      +'<div class="cap">Stufe bestimmt, ab welcher Anschlagstärke das Sample spielt. Mehrere in einer Stufe = Varianten (klingt weniger gleich).</div>';
    zs.classList.add('open');
    zs.querySelector('.x').onclick=()=>{ zs.classList.remove('open'); sel=null; if(V==='a') render(); };
    zs.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d, nr=r+d; INS.s.filter(x=>x.r===r).forEach(x=>x.r=nr); sel=nr; render(); if(V==='b') zsheet(nr,true); });
    zs.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{ const x=INS.s[+b.dataset.pl]; play(x.r,[0.35,0.75,1.1][x.l]); });
    zs.querySelectorAll('.srow .seg3 button').forEach(b=>b.onclick=()=>{ const i=+b.closest('.srow').dataset.i; INS.s[i].l=+b.dataset.lv; render(); zsheet(r,true); });
    zs.querySelectorAll('.add').forEach(b=>b.onclick=()=>hmToast('Bibliothek oder aufnehmen',false));
  }
  // Tonleiter aufnehmen (angedeutet)
  let rStart=48, rStep=4, rN=6;
  function recOpen(){
    const rc=ov.querySelector('#mkRec'); const T=[...Array(rN)].map((_,i)=>rStart+i*rStep);
    rc.innerHTML='<div class="box"><div class="sh" style="display:flex;align-items:center;gap:10px"><span style="flex:1;font:700 17px Rajdhani;color:var(--white)">Tonleiter aufnehmen</span><button class="x" style="width:44px;height:44px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:var(--panel);color:var(--blue-2)" aria-label="Schließen">✕</button></div>'
      +'<div class="opt">Ab <button data-s="-12">−</button><b style="font:700 16px JetBrains Mono;color:#8be86a;min-width:40px;text-align:center">'+midiName(rStart)+'</b><button data-s="12">+</button></div>'
      +'<div class="opt">Abstand '+[[2,'Ganzton'],[4,'Terz'],[7,'Quinte'],[12,'Oktave']].map(([v,t])=>'<button data-st="'+v+'" class="'+(rStep===v?'on':'')+'">'+t+'</button>').join('')+'</div>'
      +'<div class="opt">Töne '+[4,6,8,12].map(v=>'<button data-n="'+v+'" class="'+(rN===v?'on':'')+'">'+v+'</button>').join('')+'</div>'
      +'<div class="tones">'+T.map(m=>'<span data-t="'+m+'">'+midiName(m)+'</span>').join('')+'</div>'
      +'<div class="cap">Jeden Ton einmal spielen und ausklingen lassen. Wird an den Anschlägen geschnitten, Tonhöhe erkannt und als Stufe „mittel“ eingetragen. Für mehr Stufen einfach leiser/lauter nochmal aufnehmen.</div>'
      +'<button class="big">● Aufnahme starten</button></div>';
    rc.classList.add('open');
    rc.querySelector('.x').onclick=()=>{ clearInterval(rec); rc.classList.remove('open'); };
    rc.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ rStart=Math.max(36,Math.min(72,rStart+ +b.dataset.s)); recOpen(); });
    rc.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ rStep=+b.dataset.st; recOpen(); });
    rc.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ rN=+b.dataset.n; recOpen(); });
    rc.querySelector('.big').onclick=()=>{ let i=0; const sp=rc.querySelectorAll('.tones span'), bt=rc.querySelector('.big'); bt.textContent='■ Stopp – spiel '+midiName(T[0]);
      rec=setInterval(()=>{ if(i>0){ sp[i-1].classList.remove('now'); sp[i-1].classList.add('ok'); } if(i<T.length){ sp[i].classList.add('now'); bt.textContent='■ Stopp – spiel '+midiName(T[i]); play(T[i]); i++; }
        else { clearInterval(rec); bt.textContent='✓ '+T.length+' Töne erkannt – übernehmen';
          bt.onclick=()=>{ T.forEach(m=>{ if(!INS.s.some(x=>x.r===m&&x.l===1)) INS.s.push({n:'aufnahme-'+midiName(m).toLowerCase().replace('#','is'),r:m,l:1}); }); rc.classList.remove('open'); render(); hmToast(T.length+' Töne eingetragen',true,()=>{}); }; } },700); };
  }
  // Einstieg im Fenster „Sound wählen“
  const oRender=smpPickRender;
  smpPickRender=function(){ oRender(); const ls=$id('smpPickList'), r=ls.querySelector('.sp-r'); if(!r) return;
    const mk=(html,cls,fn)=>{ const b=document.createElement('button'); b.className=cls; b.innerHTML=html; b.onclick=fn; ls.insertBefore(b,r); };
    mk('<span>GITARRE</span><small>Instrument · '+roots().length+' Töne</small>','',()=>{ smpPickClose(); openB(); });
    mk(TR_IC.plus+'<span>Instrument bauen</span>','sp-r',()=>{ smpPickClose(); openB(); }); };
  function openB(){ sel=null; ov.innerHTML=''; render(); ov.classList.add('open'); }
  function setV(v){ V=v; sel=null; if(ov.classList.contains('open')){ ov.innerHTML=''; render(); } }
  function open(){
    if(isPlaying) stop(); closeSheets(); ov.classList.remove('open'); if(prIsOpen()) prClose();
    tr=TRACKS.find(t=>trInstKey(t)==='sampler');
    if(!tr){ if(melCount()>=MEL_MAX){ hmToast('Höchstens '+MEL_MAX+' Melodiespuren',false); return; } tr=trAddNew({k:'sampler', label:melSuggest('SAMPLER')}); }
    setTimeout(()=>{ openKlang(tr,'sound'); setTimeout(()=>smpPickOpen(tr),250); },80);
  }
  window.__mk={setV,open,openB};
}

// ===== Rahmen-Steuerung =====
const fR=document.getElementById('fR');
let V='a';
function hook(){ const w=fR.contentWindow; try{ if(!w||w.eval('typeof TRACKS')!=='object') return null; if(!w.__mk) w.eval('('+MK.toString()+')()'); }catch(e){ console.error(e); return null; } return w.__mk; }
function apply(){ const m=hook(); if(m) m.setV(V); document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V)); }
fR.addEventListener('load',()=>setTimeout(()=>{ apply(); const m=hook(); if(m) m.open(); },900));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ V=b.dataset.v; apply(); });
document.getElementById('exBtn').onclick=()=>{ const m=hook(); if(m) m.open(); };
const notes=document.getElementById('notes').innerHTML; document.getElementById('side').innerHTML=notes; const info=document.getElementById('info'); info.innerHTML=notes;
document.getElementById('infoBtn').onclick=()=>info.classList.toggle('open');
const fitTop=()=>{ const h=document.getElementById('mbar').offsetHeight; document.getElementById('stage').style.top=h+'px'; info.style.top=h+'px'; }; addEventListener('resize',fitTop); fitTop();
</script>
