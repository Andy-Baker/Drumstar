<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kit löschen #63</title>
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="../../css/app.css">
<style>
  /* Nur fürs Mockup: Varianten-Umschalter oben, App-Fenster darunter (echtes CSS der App) */
  #mockBar{ position:fixed; left:0; right:0; top:0; z-index:200; display:flex; gap:4px; padding:6px 10px; background:#06070a; border-bottom:1px solid #222; }
  #mockBar button{ flex:1; min-height:38px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:#14161c; color:#7f8898; font:700 12px 'Rajdhani',sans-serif; letter-spacing:.04em; }
  #mockBar button.on{ border-color:#3fa9ff; color:#5fc2ff; background:rgba(63,169,255,.14); }
  #kitPickerOverlay{ top:51px !important; }
  /* Neu für #63 */
  .kc-h{ font-size:15px; font-weight:700; color:var(--tx,#e9edf3); }
  .kc-use{ display:flex; flex-direction:column; gap:4px; max-height:180px; overflow-y:auto; }
  .kc-use div{ display:flex; align-items:center; gap:8px; background:var(--panel-inset,#0e0f14); border-radius:7px; padding:8px 10px; font-size:13px; }
  .kc-use b{ font:11px 'JetBrains Mono',monospace; padding:1px 6px; border-radius:4px; background:rgba(63,169,255,.14); color:var(--blue-2,#5fc2ff); flex:none; }
  .kc-use b.song{ background:rgba(176,124,255,.16); color:#c9a6ff; }
  .kc-use span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kc-info{ font-size:12px; color:var(--dim,#7f8898); line-height:1.4; }
  .kc-row button.danger{ border-color:rgba(255,107,107,.55); background:rgba(255,107,107,.12); color:#ff8a8a; }
  #hmToast.on{ opacity:1; pointer-events:auto; }
  #hmToast button{ background:none; border:0; color:var(--blue-2,#5fc2ff); font:700 11px 'JetBrains Mono',monospace; text-transform:uppercase; padding:6px 4px; }
</style></head>
<body>
<div id="mockBar"><button data-v="a" class="on">A · Nur wenn benutzt fragen</button><button data-v="b">B · Immer fragen</button></div>

<div id="kitPickerOverlay" class="open">
  <div id="kitPickerHead"><h2 class="ovt">Kit wählen</h2><button id="kitPickerCloseBtn" aria-label="Schließen">✕</button></div>
  <div class="kp-sec">Standard</div>
  <div id="kitPickerList">
    <div class="kit-chip active"><div class="kn">ROCK KIT</div><div class="kd">Live · akustisch · druckvoll</div></div>
    <div class="kit-chip smp"><div class="kt"><div class="grow"><div class="kn">STUDIO KIT</div><div class="kd">Echte Aufnahmen · modern, trocken · 1,8 MB</div></div></div></div>
    <div class="kit-chip smp"><div class="kt"><div class="grow"><div class="kn">STUDIO 67</div><div class="kd">Echte Aufnahmen · 1967er Snare, lockere Hi-Hat · 2,5 MB</div></div></div></div>
    <div class="kit-chip"><div class="kn">FM-909</div><div class="kd">Klassisch · punchy</div></div>
  </div>
  <div class="kp-sec">Eigene Sets</div>
  <div id="kitOwnList"></div>
</div>

<div id="kitConfirm"><div class="kc-box" id="kcBox"></div></div>
<div id="hmToast"><span id="tT"></span><button id="tU">Rückgängig</button></div>

<script>
const DEL='<svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const REN='<svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>';
let V='a';
let SETS=[
  {id:1,name:'Mein Latin-Set',d:'Basis ROCK KIT',use:[['Beat','Salsa Groove 96'],['Beat','Sonntag Jam'],['Song','♫ Sommer-Skizze']],cur:true},
  {id:2,name:'808 + Clap aus Küche',d:'1 Sample · Basis FM-808',use:[['Beat','Late Night']]},
  {id:3,name:'Test',d:'Basis STUDIO KIT',use:[]}];
const $=id=>document.getElementById(id);
function render(){
  const L=$('kitOwnList'); L.innerHTML='';
  SETS.forEach(s=>{ const r=document.createElement('div'); r.className='kit-chip'+(s.cur?' active':'');
    const u=s.use.length?' · in '+s.use.length+(s.use.length>1?' Beats/Songs':' Beat'):'';
    r.innerHTML='<div class="grow"><div class="kn"></div><div class="kd"></div></div><button class="kib" aria-label="Bearbeiten">'+REN+'</button><button class="kib d" aria-label="Löschen">'+DEL+'</button>';
    r.querySelector('.kn').textContent=s.name; r.querySelector('.kd').textContent=s.d;
    r.querySelector('.d').onclick=e=>{ e.stopPropagation(); ask(s); }; L.appendChild(r); });
  const nw=document.createElement('div'); nw.className='kit-chip new'; nw.textContent='＋ Neues Set aus dem aktuellen Kit'; L.appendChild(nw);
}
function ask(s){
  if(V==='a' && !s.use.length && !s.cur){ remove(s); return; }
  const n=s.use.length, B=$('kcBox');
  B.innerHTML='<div class="kc-h"></div>'+(n?'<div>Wird verwendet in '+n+(n>1?' Beats/Songs':' Beat/Song')+':</div><div class="kc-use"></div>':'<div>Wird in keinem gespeicherten Beat oder Song verwendet.</div>')
    +(s.cur?'<div class="kc-info">Ist gerade geladen – der aktuelle Beat behält den Klang, das Set gilt dann als „eigene Änderung“.</div>':'')
    +(n?'<div class="kc-info">Diese Beats und Songs klingen weiter wie bisher – das Set ist in ihnen mitgespeichert. Nur der Eintrag hier in der Liste verschwindet.</div>':'')
    +'<div class="kc-row"><button class="danger" id="kcDel">Löschen</button><button id="kcNo">Abbrechen</button></div>';
  B.querySelector('.kc-h').textContent='„'+s.name+'“ löschen?';
  if(n){ const U=B.querySelector('.kc-use'); s.use.forEach(([t,nm])=>{ const d=document.createElement('div'); d.innerHTML='<b class="'+(t==='Song'?'song':'')+'">'+t.toUpperCase()+'</b><span></span>'; d.querySelector('span').textContent=nm; U.appendChild(d); }); }
  $('kitConfirm').classList.add('open');
  $('kcDel').onclick=()=>{ $('kitConfirm').classList.remove('open'); remove(s); };
  $('kcNo').onclick=()=>$('kitConfirm').classList.remove('open');
}
let last=null;
function remove(s){ const i=SETS.indexOf(s); last=[i,s]; SETS.splice(i,1); render();
  $('tT').textContent='„'+s.name+'“ gelöscht'; $('hmToast').classList.add('on'); clearTimeout(remove.t); remove.t=setTimeout(()=>$('hmToast').classList.remove('on'),4000); }
$('tU').onclick=()=>{ if(!last) return; SETS.splice(last[0],0,last[1]); last=null; render(); $('hmToast').classList.remove('on'); };
$('kitConfirm').onclick=e=>{ if(e.target.id==='kitConfirm') $('kitConfirm').classList.remove('open'); };
$('mockBar').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; V=b.dataset.v; [...$('mockBar').children].forEach(x=>x.classList.toggle('on',x===b)); };
render();
</script>
</body></html>
