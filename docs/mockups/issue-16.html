<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample-Editor: Effekte (#16)</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
/* Mockup zu Issue #16 (Rest: Effekte im Sample-Editor). Die echte App läuft im Rahmen, der Sample-Editor
   öffnet sich mit einem Demo-Loop. Neu ist nur die Karte „Effekte“ in „3 · Bearbeiten“. Klang = echte
   Effekt-Geräte der App (FXDEF), Hall/Delay als Mischung im Sample. */
:root{color-scheme:dark;--bg:#050507;--blue:#3fa9ff;--blue-2:#8fd4ff;--white:#f4f5f7;--dim:#7d818c;--metal:#c7cbd4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',system-ui,sans-serif}
#mbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:repeating-linear-gradient(135deg,#0b1622 0 8px,#0d1a28 8px 16px);border-bottom:1px dashed rgba(63,169,255,.45);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2)}
#mbar .g{display:flex;align-items:center;gap:4px}
#mbar button{height:30px;padding:0 7px;border-radius:6px;border:1px solid rgba(63,169,255,.45);background:rgba(63,169,255,.12);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2);cursor:pointer}
#mbar button.on{background:var(--blue);color:#042c53}
#mbar label{display:flex;align-items:center;gap:4px;cursor:pointer}
#mbar .sp{flex:1}
#stage{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;gap:28px;overflow:auto}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;width:100%}
iframe{border:0;width:100%;height:100%;background:#050507;display:block}
#side{display:none;width:340px;font-size:14px;color:var(--metal);line-height:1.45;padding-top:20px}
#side h3,#info h3{font:700 11px 'Rajdhani';letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#side p,#info p{margin:0 0 8px} #side b,#info b{color:var(--white)}
#side ul,#info ul{margin:0 0 8px;padding-left:18px} #side li,#info li{margin:3px 0}
#info{position:fixed;inset:44px 0 0 0;z-index:190;background:#07080bf2;overflow:auto;padding:8px 18px 40px;font-size:14.5px;color:var(--metal);line-height:1.45;display:none}
#info.open{display:block}
@media (min-width:900px) and (min-height:900px){
  #stage{padding:14px 0}
  .ph{width:auto;height:auto}
  iframe{width:390px;height:844px;border-radius:30px;border:8px solid #1a1e26;box-shadow:0 30px 80px rgba(0,0,0,.75);box-sizing:content-box}
  #side{display:block} #infoBtn{display:none}
}
</style>
</head>
<body>
<div id="mbar">
  <span>#16 v2</span>
  <div class="g"><button data-v="">Heute</button><button data-v="a" class="on">Neu</button></div>
  <span class="sp"></span>
  <label><input type="checkbox" id="mk"> Neu</label>
  <button id="demoBtn">Demo</button>
  <button id="infoBtn">ⓘ</button>
</div>
<div id="stage">
  <div class="ph"><iframe id="fR" src="../../index.html" title="App mit Vorschlag"></iframe></div>
  <div id="side"></div>
</div>
<div id="info"></div>
<template id="notes">
  <h3>Was das ist (v2, schlank)</h3>
  <p>Die <b>echte App</b>, Sample-Editor mit Demo-Loop. Unter „3 · Bearbeiten“ neu eine Zeile <b>Effekte</b>. Arbeitsweise wie Wavelab: Effekt antippen, Preset wählen, mit Schiebern nach Gehör einstellen, <b>Vorhören</b>, <b>Anwenden</b> – dann ist er fest im Sample. Weitere Effekte einfach danach anwenden.</p>
  <h3>Effekte</h3>
  <ul>
    <li><b>Filter</b> (Dumpf, Dünn, Telefon) · Schieber Frequenz</li>
    <li><b>Verzerrung</b> (Wärme, Crunch, Fuzz) · Schieber Drive</li>
    <li><b>Kompressor</b> (Sanft, Punch, Platt) · Schieber Stärke</li>
    <li><b>Hall</b> (Raum, Halle, Weit) + <b>Normal | Rückwärts</b> · Schieber Länge, Mischung</li>
    <li><b>Delay</b> (Slapback, Echo, Dub) · Schieber Feedback, Mischung</li>
  </ul>
  <p>Immer nur ein Effekt offen, höchstens 2 Schieber. Wirkt aufs ganze Sample (wie Lauter/Rückwärts). Hall/Delay hängen den Ausklang an, Rückwärts-Hall setzt ihn davor. Rückgängig und „Zurück zum Original“ gehen. Beim Spielen keine Last, nichts Neues im Speicherformat.</p>
  <h3>Zur Entscheidung</h3>
  <ul>
    <li>Passt die Auswahl der 5 Effekte (EQ weggelassen, Filter deckt das Grobe ab)?</li>
    <li>Passt der Platz unter „Bearbeiten“?</li>
  </ul>
</template>
<script>
// ===== Läuft im Rahmen der echten App (per eval im Fenster der App) =====
function MK(){
  let V='a', cur=null, P=null, preBuf=null, busy=false;
  const IC={
    filter:'<path d="M3 8h9c3 0 4 2 5 5l3 6"/>',
    dist:'<path d="M3 12c2-6 4-6 5 0s3 6 5 0 3-6 5 0 2 4 3 4"/>',
    comp:'<path d="M4 4v16M4 20L12 12h8"/>',
    hall:'<path d="M4 20c0-9 7-16 16-16M8 20c0-6 6-12 12-12M12 20c0-4 4-8 8-8"/>',
    delay:'<circle cx="6" cy="12" r="3"/><circle cx="13" cy="12" r="2.2" opacity=".7"/><circle cx="19" cy="12" r="1.5" opacity=".45"/>'
  };
  const T={
    filter:{n:'Filter',pre:[['Dumpf',{ty:'lowpass',fr:.42,q:.25}],['Dünn',{ty:'highpass',fr:.45,q:.2}],['Telefon',{ty:'bandpass',fr:.6,q:.35}]],ps:[{k:'fr',l:'Frequenz',a:0,b:1,s:.005}]},
    dist:{n:'Verzerrung',pre:FXDEF.dist.pre,ps:[{k:'dr',l:'Drive',a:0,b:1,s:.01}]},
    comp:{n:'Kompressor',pre:[['Sanft',{st:.3}],['Punch',{st:.55}],['Platt',{st:.9}]],ps:[{k:'st',l:'Stärke',a:0,b:1,s:.01}]},
    hall:{n:'Hall',md:1,pre:[['Raum',{sz:.8,to:.6,mx:.3}],['Halle',{sz:2,to:.5,mx:.35}],['Weit',{sz:3.8,to:.45,mx:.4}]],ps:[{k:'sz',l:'Länge',a:.3,b:5,s:.1},{k:'mx',l:'Mischung',a:0,b:1,s:.01}]},
    delay:{n:'Delay',pre:[['Slapback',{tm:.09,fb:.15,to:.8,mx:.3}],['Echo',{tm:.3,fb:.4,to:.6,mx:.3}],['Dub',{tm:.45,fb:.6,to:.3,mx:.35}]],ps:[{k:'fb',l:'Feedback',a:0,b:.85,s:.01},{k:'mx',l:'Mischung',a:0,b:1,s:.01}]}
  };
  const ORDER=['filter','dist','comp','hall','delay'];
  const css=document.createElement('style');
  css.textContent=`
  #mkFxLb,#mkFxRow,#mkFxP{display:none}
  html.mk-a #mkFxLb{display:block} html.mk-a #mkFxRow{display:grid} html.mk-a #mkFxP.on{display:flex}
  #mkFxLb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:2px 2px -2px}
  #mkFxRow{grid-template-columns:repeat(5,1fr);gap:6px;flex-shrink:0}
  #mkFxRow button{min-height:56px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:var(--panel);color:#c7cbd4;font:500 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 2px}
  #mkFxRow button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--blue-2)}
  #mkFxRow button.on{border-color:var(--blue);background:rgba(63,169,255,.15);color:var(--blue-2);box-shadow:0 0 10px rgba(63,169,255,.25)}
  #mkFxP{flex-direction:column;gap:8px;background:var(--panel);border:1px solid rgba(63,169,255,.35);border-radius:10px;padding:10px;flex-shrink:0}
  #mkFxP .seg button.on{background:rgba(63,169,255,.2);color:var(--blue-2)}
  .mkfx-k{display:flex;align-items:center;gap:10px;font-size:13px;color:#c7cbd4;min-height:32px}
  .mkfx-k span{width:78px;flex-shrink:0}
  .mkfx-k input{flex:1;accent-color:#3fa9ff}
  .mkfx-f{display:flex;gap:6px}
  .mkfx-f button{flex:1;min-height:42px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:var(--panel-inset);color:#c7cbd4;font:700 12px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .mkfx-f button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .mkfx-f .ok{border-color:var(--blue);background:rgba(63,169,255,.18);color:var(--blue-2);flex:1.4}
  .mkfx-f .x{flex:0 0 44px}
  html.mkmark .mk-new{outline:1.5px dashed #ffc247!important;outline-offset:1px}`;
  document.head.appendChild(css);
  const svg=p=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>';
  const lb=document.createElement('div'); lb.id='mkFxLb'; lb.className='mk-new'; lb.textContent='Effekte';
  const row=document.createElement('div'); row.id='mkFxRow'; row.className='mk-new';
  row.innerHTML=ORDER.map(t=>'<button data-t="'+t+'">'+svg(IC[t])+T[t].n+'</button>').join('');
  const pan=document.createElement('div'); pan.id='mkFxP'; pan.className='mk-new';
  [lb,row,pan].forEach(e=>seResetBtn.parentNode.insertBefore(e, seResetBtn));
  row.onclick=e=>{ const b=e.target.closest('[data-t]'); if(!b) return; const t=b.dataset.t; stopPre(); if(cur===t){ cur=null; } else { cur=t; P={pi:0,rev:false,p:Object.assign({},T[t].pre[0][1])}; } draw(); };
  function draw(){
    row.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
    pan.classList.toggle('on',!!cur); if(!cur){ pan.innerHTML=''; return; }
    const d=T[cur];
    pan.innerHTML='<div class="seg se-seg">'+d.pre.map((x,i)=>'<button data-pi="'+i+'" class="'+(P.pi===i?'on':'')+'">'+x[0]+'</button>').join('')+'</div>'
      +(d.md?'<div class="seg se-seg"><button data-r="0" class="'+(P.rev?'':'on')+'">Normal</button><button data-r="1" class="'+(P.rev?'on':'')+'">Rückwärts</button></div>':'')
      +d.ps.map(p=>'<label class="mkfx-k"><span>'+p.l+'</span><input type="range" data-k="'+p.k+'" min="'+p.a+'" max="'+p.b+'" step="'+p.s+'" value="'+P.p[p.k]+'"></label>').join('')
      +'<div class="mkfx-f"><button class="x" data-a="x" aria-label="Schließen">'+svg('<path d="M6 6l12 12M18 6L6 18"/>')+'</button>'
      +'<button data-a="pre">'+svg(prePlaying()?'<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>':'<polygon points="6,4 20,12 6,20" fill="currentColor"/>')+(prePlaying()?'Stopp':'Vorhören')+'</button>'
      +'<button class="ok" data-a="ok">'+svg('<path d="M4 12l5 5L20 6"/>')+'Anwenden</button></div>';
    pan.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{ P.pi=+b.dataset.pi; P.p=Object.assign({},d.pre[P.pi][1]); changed(); });
    pan.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ P.rev=b.dataset.r==='1'; changed(); });
    pan.querySelectorAll('[data-k]').forEach(i=>{ i.oninput=()=>{ P.p[i.dataset.k]=+i.value; P.pi=-1; pan.querySelectorAll('[data-pi]').forEach(b=>b.classList.remove('on')); }; i.onchange=()=>changed(true); });
    pan.querySelector('[data-a=x]').onclick=()=>{ stopPre(); cur=null; draw(); };
    pan.querySelector('[data-a=pre]').onclick=()=>{ if(prePlaying()){ stopPre(); draw(); } else play(); };
    pan.querySelector('[data-a=ok]').onclick=apply;
  }
  // ---- Ein Effekt, offline gerechnet (Vorhören = dasselbe wie Anwenden) ----
  function ir(c,sz){ const n=Math.floor(c.sampleRate*sz), b=c.createBuffer(2,n,c.sampleRate); for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.8); } return b; }
  function node(c,t,p,wetOnly){ const i=c.createGain(), o=c.createGain();
    if(t==='filter'){ const n=FXDEF.filter.build(c); n.u(Object.assign({},T.filter.pre[0][1],p)); i.connect(n.i); n.o.connect(o); }
    else if(t==='dist'){ const n=FXDEF.dist.build(c); n.u(Object.assign({},FXDEF.dist.pre[1][1],p)); i.connect(n.i); n.o.connect(o); }
    else if(t==='comp'){ const n=FXDEF.comp.build(c); n.u({th:-6-p.st*34,ra:1.5+p.st*10,at:10,re:150,kn:6,mk:0}); i.connect(n.i); n.o.connect(o); }
    else { let wet;
      if(t==='hall'){ const cv=c.createConvolver(), lp=c.createBiquadFilter(); cv.buffer=ir(c,p.sz); lp.type='lowpass'; lp.frequency.value=fxEx(1500,16000,p.to); i.connect(cv); cv.connect(lp); wet=lp; }
      else { const dl=c.createDelay(2), fb=c.createGain(), lp=c.createBiquadFilter(); dl.delayTime.value=p.tm; fb.gain.value=p.fb; lp.type='lowpass'; lp.frequency.value=fxEx(600,13000,p.to); i.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); wet=lp; }
      const wg=c.createGain(); wg.gain.value=p.mx; wet.connect(wg); wg.connect(o);
      if(!wetOnly){ const dg=c.createGain(); dg.gain.value=1-p.mx*.5; i.connect(dg); dg.connect(o); } }
    return {i,o}; }
  const tailOf=(t,p)=>t==='hall'?p.sz:t==='delay'?Math.min(4,p.tm*Math.log(.001)/Math.log(Math.max(.05,p.fb))):0;
  function revBuf(b){ const o=new AudioBuffer({length:b.length,numberOfChannels:b.numberOfChannels,sampleRate:b.sampleRate}); for(let c=0;c<b.numberOfChannels;c++){ const s=b.getChannelData(c), d=o.getChannelData(c); for(let i=0;i<s.length;i++) d[i]=s[s.length-1-i]; } return o; }
  async function renderWith(B,wetOnly,len){ const ch=(cur==='hall'||cur==='delay')?2:B.numberOfChannels, oc=new OfflineAudioContext(ch,len,B.sampleRate), s=oc.createBufferSource(); s.buffer=B; const n=node(oc,cur,P.p,wetOnly); s.connect(n.i); n.o.connect(oc.destination); s.start(0); return oc.startRendering(); }
  async function render(){
    const B=seWorkingBuffer, sr=B.sampleRate, M=Math.round(tailOf(cur,P.p)*sr);
    let out;
    if(cur==='hall' && P.rev){ // umdrehen → Hall (nur Hallanteil) → umdrehen, Original dahinter
      const z=revBuf(await renderWith(revBuf(B),true,B.length+M));
      out=new AudioBuffer({length:B.length+M,numberOfChannels:2,sampleRate:sr});
      for(let c=0;c<2;c++){ const d=out.getChannelData(c), zc=z.getChannelData(c), bc=B.getChannelData(Math.min(c,B.numberOfChannels-1)); d.set(zc); for(let i=0;i<B.length;i++) d[M+i]+=bc[i]*(1-P.p.mx*.3); }
    } else out=await renderWith(B,false,B.length+M);
    if(M){ let last=out.length-1; const end=(cur==='hall'&&P.rev)?0:B.length; for(;last>end;last--){ let pk=0; for(let c=0;c<out.numberOfChannels;c++) pk=Math.max(pk,Math.abs(out.getChannelData(c)[last])); if(pk>.001) break; } if(last<out.length-1) out=bufferSlice(out,0,(last+1)/sr); }
    return out;
  }
  let preSrc=null; const prePlaying=()=>!!preSrc;
  function stopPre(){ if(preSrc){ const s=preSrc; preSrc=null; try{s.stop();}catch(e){} } }
  async function play(){ if(!seWorkingBuffer||busy) return; busy=true; seStopPreview(); const b=await render(); busy=false; if(!cur) return;
    stopPre(); const s=audioCtx.createBufferSource(); s.buffer=b; s.connect(master); s.start(); s.onended=()=>{ if(preSrc===s){ preSrc=null; draw(); } }; preSrc=s; draw(); }
  function changed(rePlay){ const was=prePlaying(); draw(); if(was) play(); }
  async function apply(){ if(!seWorkingBuffer||busy) return; stopPre(); busy=true; const out=await render(); busy=false; seApplyTransform(()=>out); cur=null; draw(); }
  // ---- Demo: kleiner Drum-Loop (2 Takte, 100 BPM) ----
  function demo(){
    if(!audioCtx) initAudio();
    if(sePreviewSrc) seStopPreview(); stopPre();
    const sr=44100, st=60/100/4, n=Math.round(sr*st*32), b=new AudioBuffer({length:n,numberOfChannels:1,sampleRate:sr}), d=b.getChannelData(0);
    let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647)*2-1;
    const add=(t0,fn,dur)=>{ const a=Math.round(t0*sr), m=Math.min(n-a,Math.round(dur*sr)); for(let i=0;i<m;i++) d[a+i]+=fn(i/sr); };
    const kick=t=>Math.sin(2*Math.PI*(50*t+90*(1-Math.exp(-t*30))/30))*Math.exp(-t*9)*.8;
    let lp=0; const snare=t=>{ lp+=(rnd()-lp)*.5; return (lp*.6+Math.sin(2*Math.PI*190*t)*.4)*Math.exp(-t*18)*.55; };
    let hp=0; const hat=t=>{ const r=rnd(); const v=r-hp; hp=r; return v*Math.exp(-t*60)*.18; };
    const K=[0,6,10,16,22,26,29], S=[4,12,20,28];
    for(let s=0;s<32;s++){ if(K.includes(s)) add(s*st,kick,.5); if(S.includes(s)) add(s*st,snare,.3); if(s%2===0) add(s*st,hat,.08); }
    openSampleEditor({buffer:b,label:'Demo-Loop'});
    cur=null; setTimeout(()=>{ draw(); setTimeout(()=>row.scrollIntoView({block:'center'}),50); },80);
  }
  function setV(v){ V=v; stopPre(); document.documentElement.classList.toggle('mk-a',v==='a'); draw(); }
  function setMark(on){ document.documentElement.classList.toggle('mkmark',on); }
  draw();
  window.__mk={setV,demo,setMark};
}

// ===== Rahmen-Steuerung =====
const fR=document.getElementById('fR');
let V='a';
function hook(){ const w=fR.contentWindow; try{ if(!w||w.eval('typeof openSampleEditor')!=='function') return null; if(!w.__mk) w.eval('('+MK.toString()+')()'); }catch(e){ console.error(e); return null; } return w.__mk; }
function apply(){ const m=hook(); if(m) m.setV(V); document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V)); }
fR.addEventListener('load',()=>setTimeout(()=>{ const m=hook(); if(!m) return; m.demo(); setTimeout(apply,200); },800));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ V=b.dataset.v; apply(); });
document.getElementById('demoBtn').onclick=()=>{ const m=hook(); if(m){ m.demo(); setTimeout(()=>m.setV(V),200); } };
document.getElementById('mk').onchange=e=>{ const m=hook(); if(m) m.setMark(e.target.checked); };
const notes=document.getElementById('notes').innerHTML; document.getElementById('side').innerHTML=notes; const info=document.getElementById('info'); info.innerHTML=notes;
document.getElementById('infoBtn').onclick=()=>info.classList.toggle('open');
const fitTop=()=>{ const h=document.getElementById('mbar').offsetHeight; document.getElementById('stage').style.top=h+'px'; info.style.top=h+'px'; }; addEventListener('resize',fitTop); fitTop();
</script>
</body>
</html>
