   +'<div class="grp">Pegel</div><div class="srow"><label>Plugin</label><input type="range" min="-24" max="6" step="0.5" value="-6"><b class="rs">-6 dB</b></div>'
   +'<p class="pl-note">Ab Werk −6 dB: volle Akkorde mancher Presets gehen sonst über 0 dB (Handytest).</p>'
   +'<details class="pl-all"><summary>Alle '+OXO_PARAMS.length+' Parameter</summary>'+Object.keys(groups).map(g=>'<div class="grp">'+g+'</div>'+groups[g].map(p=>srow(p[1],p)).join('')).join('')+'</details>';
  $('pPrev').onclick=()=>{ pIdx=(pIdx+OXO_PRESETS.length-1)%OXO_PRESETS.length; sheet(); };
  $('pNext').onclick=()=>{ pIdx=(pIdx+1)%OXO_PRESETS.length; sheet(); };
  $('pN').onclick=$('plList').onclick=()=>{ view='presets'; cat=catOf(OXO_PRESETS[pIdx]); sheet(); };
  $('plSwap').onclick=()=>{ $('klSheet').classList.remove('open'); picker(); };
}
$('ovSnd').onclick=picker; $('soundPickerCloseBtn').onclick=()=>$('soundPickerOverlay').classList.remove('open');
$('ovKlang').onclick=()=>{ view='main'; sheet(); $('klSheet').classList.add('open'); };
$('klX').onclick=()=>$('klSheet').classList.remove('open'); $('klBack').onclick=()=>{ view='main'; sheet(); };
$('mockBar').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; V=b.dataset.v; [...$('mockBar').children].forEach(x=>x.classList.toggle('on',x===b)); snd=V==='b'?'none':'piano'; $('klSheet').classList.remove('open'); $('soundPickerOverlay').classList.remove('open'); paint(); };
paint();
</script>
</body></html>
