<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sampler: mehr Werk-Instrumente (#71)</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
/* Mockup zu Issue #71: Auswahl der Werk-Instrumente im Klang-Sheet des Samplers. Die echte App läuft im Rahmen;
   nur die Chip-Liste „Sample“ wird zur Laufzeit ersetzt. Neue Instrumente sind Platzhalter (noch keine Aufnahmen). */
:root{color-scheme:dark;--bg:#050507;--blue:#3fa9ff;--blue-2:#8fd4ff;--white:#f4f5f7;--dim:#7d818c;--metal:#c7cbd4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',system-ui,sans-serif}
#mbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:repeating-linear-gradient(135deg,#0b1622 0 8px,#0d1a28 8px 16px);border-bottom:1px dashed rgba(63,169,255,.45);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2)}
#mbar .g{display:flex;align-items:center;gap:4px}
#mbar button{height:30px;padding:0 7px;border-radius:6px;border:1px solid rgba(63,169,255,.45);background:rgba(63,169,255,.12);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2);cursor:pointer}
#mbar button.on{background:var(--blue);color:#042c53}
#mbar .sp{flex:1}
#stage{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;gap:28px;overflow:auto}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;width:100%}
iframe{border:0;width:100%;height:100%;background:#050507;display:block}
#side{display:none;width:340px;font-size:14px;color:var(--metal);line-height:1.45;padding-top:20px}
#side h3,#info h3{font:700 11px 'Rajdhani';letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#side p,#info p{margin:0 0 8px} #side b,#info b{color:var(--white)}
#side ul,#info ul{margin:0 0 8px;padding-left:18px} #side li,#info li{margin:3px 0}
#info{position:fixed;inset:44px 0 0 0;z-index:190;background:#07080bf2;overflow:auto;padding:8px 18px 40px;font-size:14.5px;color:var(--metal);line-height:1.45;display:none}
#info.open{display:block}
@media (min-width:900px) and (min-height:900px){
  #stage{padding:14px 0}
  .ph{width:auto;height:auto}
  iframe{width:390px;height:844px;border-radius:30px;border:8px solid #1a1e26;box-shadow:0 30px 80px rgba(0,0,0,.75);box-sizing:content-box}
  #side{display:block} #infoBtn{display:none}
}
</style>
</head>
<body>
<div id="mbar">
  <span>#71</span>
  <div class="g"><button data-v="g" class="on">G Klappliste</button><button data-v="h">H Fenster</button></div>
  <span class="sp"></span>
  <button id="exBtn">Öffnen</button>
  <button id="infoBtn">ⓘ</button>
</div>
<div id="stage">
  <div class="ph"><iframe id="fR" src="../../index.html" title="App mit Vorschlag"></iframe></div>
  <div id="side"></div>
</div>
<div id="info"></div>
<template id="notes">
  <h3>Was das ist</h3>
  <p>Die <b>echte App</b>. <b>Öffnen</b> legt eine Sampler-Spur an (falls keine da ist) und öffnet Klang · Sound. Nur die Liste <b>Sample</b> ist ersetzt.</p>
  <p>Einträge mit <b>NEU</b> = <b>neu vorgeschlagen</b> (noch keine Aufnahme, Antippen zeigt nur Quelle). STREICHER, PIZZICATO, KONTRABASS, BASS ARCO und eigene Samples klingen wie in der App.</p>
  <h3>Vorschlag (alle CC0, wie #61 gebaut)</h3>
  <ul>
    <li><b>E-PIANO</b> – FM-E-Piano (Yamaha TX81Z, 80er), VCSL</li>
    <li><b>VIBRAPHON</b> – weiche Schlägel, VCSL</li>
    <li><b>MARIMBA</b> – VCSL bzw. VSCO 2 CE</li>
    <li><b>GLOCKENSPIEL</b> – VSCO 2 CE (ersetzt GLAS)</li>
    <li><b>HARFE</b> – Konzertharfe, VCSL</li>
    <li><b>KALIMBA</b> – VCSL</li>
  </ul>
  <p>Je Instrument eine MP3 von ca. 0,5–1 MB, geladen erst bei Wahl (wie heute).</p>
  <h3>Varianten (Seite bleibt stehen)</h3>
  <p>Zu: ruhiges LCD-Feld, Name groß, Beschreibung klein. Liste nur beim Antippen, <b>der Reiter darunter bewegt sich nicht</b>. Auswahl schließt und spielt einmal an. „Aufnehmen / Laden“ = letzte Zeile.</p>
  <ul>
    <li><b>G · Klappliste</b>: LCD-Liste legt sich <b>über</b> den Inhalt direkt unter dem Feld, ca. 6 Zeilen hoch, scrollt in sich. Daneben tippen = zu.</li>
    <li><b>H · Fenster</b>: eigenes Auswahl-Fenster von unten (wie die Kit-Auswahl), Hintergrund abgedunkelt, LCD-Liste darin, ✕ zum Schließen.</li>
  </ul>
  <p>Gruppen: <b>Orchester</b> · <b>Tasten &amp; Mallets</b> · <b>Synth</b> (VOX/SYNTH-BASS) · <b>Eigene</b> (Stücke einklappbar). <b>NEU</b> = Vorschlag ohne Aufnahme.</p>
  <h3>Offen: Chor und echtes E-Piano (Rhodes)</h3>
  <p>In VSCO 2 CE und VCSL gibt es <b>keinen Chor</b> und kein Rhodes. Optionen: VOX (Synth) behalten, oder andere freie Quelle suchen (dann evtl. CC-BY mit Nennung).</p>
</template>
<script>
// ===== Läuft im globalen Scope der App (per eval im Rahmen) =====
function MK(){
  if(window.__mk) return;
  let V='g';
  const NEW={ep:['E-PIANO','FM, 80er','VCSL · Yamaha TX81Z FM Piano'], vib:['VIBRAPHON','weiche Schlägel','VCSL · Vibraphone, Soft Mallets'],
    mar:['MARIMBA','Holz','VCSL / VSCO 2 CE · Marimba'], glo:['GLOCKENSPIEL','hell','VSCO 2 CE · Glock'],
    hrp:['HARFE','Konzertharfe','VCSL · Concert Harp'], kal:['KALIMBA','Daumenklavier','VCSL · Kalimba, Kenya']};
  let fake=null; // gewählter Platzhalter (nur Anzeige)
  let eOpen=false, fOpen=false; // E: Feld aufgeklappt · F: ganze Liste offen
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // Liste wie Variante B (Gruppen): h = Überschrift, i = wählbar, t = Stücke auf-/zuklappen
  function items(tr){
    const L=[], I=k=>L.push({t:'i',key:k,label:SMP_INSTR[k].name,sub:SMP_INSTR[k].desc}), N=k=>L.push({t:'i',key:k,label:NEW[k][0],sub:NEW[k][1],isNew:1}),
      W=k=>L.push({t:'i',key:k,label:SMP_WERK[k].name,sub:SMP_WERK[k].desc}), H=x=>L.push({t:'h',label:x});
    H('Orchester'); ['str','piz','kb','kba'].forEach(I); N('hrp');
    H('Tasten & Mallets'); ['ep','vib','mar','glo','kal'].forEach(N);
    H('Synth'); ['vox','bass'].forEach(W);
    H('Eigene');
    const G=smpLibGroup(SMP_LIB);
    if(!G.length) L.push({t:'e',label:'– noch keine –'});
    G.forEach(({e,kids})=>{ L.push({t:'i',key:'lib:'+e.id,label:e.name}); if(!kids.length) return;
      const open=SMP_LIB_OPEN.has(e.id) || kids.some(k=>tr.smp==='lib:'+k.id);
      L.push({t:'t',id:e.id,open,label:(open?'▾ ':'▸ ')+kids.length+' Stücke'});
      if(open) kids.forEach(k=>L.push({t:'i',key:'lib:'+k.id,label:k.name,ind:1})); });
    if(tr.smp.startsWith('lib:') && !SMP_LIB.some(e=>'lib:'+e.id===tr.smp)) L.push({t:'i',key:tr.smp,label:samplerGet(tr.smp).name});
    if(V==='g'||V==='h'){ const k=L.findIndex(x=>x.t==='e'); if(k>=0) L.splice(k,1); L.push({t:'r',label:'Aufnehmen / Laden'}); }
    return L;
  }
  const isCur=(tr,it)=>it.isNew ? fake===it.key : (!fake && tr.smp===it.key);
  async function pick(tr,it){
    if(it.isNew){ eOpen=false; fake=it.key; renderKlang(); hmToast('Vorschlag – Aufnahme folgt',false); return; }
    eOpen=false;
    fake=null; await samplerPick(tr,it.key); samplerPreview(tr); // Wählen = gleich anhören
  }
  const grpOf=(L,it)=>{ let g=''; for(const x of L){ if(x.t==='h') g=x.label; if(x===it) return g; } return g; };
  function step(tr,L,d){ const S=L.filter(x=>x.t==='i'); let i=S.findIndex(x=>isCur(tr,x)); i=(i+d+S.length)%S.length; pick(tr,S[i]); }
  function toggle(id){ if(SMP_LIB_OPEN.has(id)) SMP_LIB_OPEN.delete(id); else SMP_LIB_OPEN.add(id); renderKlang(); }
  const rowHtml=(tr,it,j)=>it.t==='r' ? '<button data-j="'+j+'" class="mk-r">'+TR_IC.plus+'<span>'+esc(it.label)+'</span></button>'
    : it.t==='h' ? '<div class="mk-h">'+esc(it.label)+'</div>'
    : it.t==='e' ? '<div class="mk-e">'+esc(it.label)+'</div>'
    : '<button data-j="'+j+'" class="'+(it.t==='t'?'mk-t':'')+(it.ind?' mk-ind':'')+(isCur(tr,it)?' cur':'')+'"><span>'+esc(it.label)+'</span>'
      +(it.isNew?'<i class="mk-new">NEU</i>':it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</button>';
  function bindRows(root,tr,L){ root.querySelectorAll('[data-j]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const it=L[+b.dataset.j]; if(it.t==='r'){ eOpen=false; closeSheets(); openSampleEditor({forSampler:tr}); } else if(it.t==='t') toggle(it.id); else pick(tr,it); }); }

  const oKl=samplerKlang;
  samplerKlang=function(tr, box, grp){
    oKl(tr, box, grp);
    const ch=box.querySelector('.smp-chips'); if(!ch) return;
    const old=[...ch.children], lib=old.slice(Object.keys(SMP_INSTR).length+Object.keys(SMP_WERK).length), rec=old[old.length-1]; // Bibliothek + „Aufnehmen“
    const L=items(tr), sel=L.filter(x=>x.t==='i'), ci=sel.findIndex(x=>isCur(tr,x)), cur=sel[ci];
    if(V==='b'){ // Chips in Gruppen (bisherige Variante B)
      ch.innerHTML='';
      L.forEach(it=>{ if(it.t==='h'){ const h=document.createElement('div'); h.className='mk-sub'; h.textContent=it.label; ch.appendChild(h); return; }
        if(it.t==='e') return;
        const b=document.createElement('button'); b.className='smp-chip'+(isCur(tr,it)?' on':'')+(it.t==='t'?' subt':'')+(it.ind?' sub':'');
        b.innerHTML=(it.isNew?'<i class="mk-dot"></i>':'')+'<b></b>'+(it.sub?'<small></small>':''); b.querySelector('b').textContent=it.label; if(it.sub) b.querySelector('small').textContent=it.sub;
        b.onclick=()=>it.t==='t'?toggle(it.id):pick(tr,it); ch.appendChild(b); });
      ch.appendChild(rec);
    } else {
      const w=document.createElement('div');
      const name=cur?esc(cur.label):'–', sub=cur?(cur.isNew?'<i class="mk-new">NEU</i>':cur.sub?'<em>'+esc(cur.sub)+'</em>':''):'';
      // G/H: ruhiges LCD-Feld; Liste nur auf Wunsch, Seite bewegt sich nicht. G = Klappliste über dem Inhalt, H = eigenes Auswahl-Fenster.
      w.className='mk-lcd mk-ef'+(eOpen&&V==='g'?' open':'');
      w.innerHTML='<button class="mk-fld" aria-expanded="'+eOpen+'" aria-label="Sound wählen">'
        +'<span class="x"><span class="nm">'+name+(cur&&cur.isNew?' <i class="mk-new">NEU</i>':'')+'</span>'+(cur&&cur.sub?'<span class="sb">'+esc(cur.sub)+'</span>':'')+'</span>'
        +(eOpen&&V==='g'?FXI.up:FXI.dn)+'</button>'
        +(eOpen&&V==='g'?'<div class="mk-pop mk-full" role="listbox">'+L.map((it,j)=>rowHtml(tr,it,j)).join('')+'</div>':'');
      w.querySelector('.mk-fld').onclick=e=>{ e.stopPropagation(); eOpen=!eOpen; renderKlang(); };
      const centre=ls=>{ const c=ls&&ls.querySelector('.cur'); if(c) ls.scrollTop=c.offsetTop-ls.clientHeight/2+c.offsetHeight/2; };
      if(eOpen&&V==='g') requestAnimationFrame(()=>{ const pp=w.querySelector('.mk-pop'), r=w.getBoundingClientRect(), dn=innerHeight-r.bottom-14, up=r.top-14;
        Object.assign(pp.style,{position:'fixed',left:r.left+'px',right:'auto',width:r.width+'px'}); // nicht vom Sheet abschneiden lassen
        if(dn<260 && up>dn){ pp.style.top='auto'; pp.style.bottom=(innerHeight-r.top+4)+'px'; pp.style.maxHeight=Math.min(380,up)+'px'; } else { pp.style.top=(r.bottom+4)+'px'; pp.style.maxHeight=Math.min(380,dn)+'px'; }
        centre(pp); });
      let ov=document.getElementById('mkPick'); if(ov) ov.remove();
      if(eOpen&&V==='h'){ // eigenes Fenster wie die Kit-Auswahl
        ov=document.createElement('div'); ov.id='mkPick';
        ov.innerHTML='<div class="mk-bd"></div><div class="mk-sh"><div class="mk-shh"><b>Sound wählen</b><button class="mk-x" aria-label="Schließen">✕</button></div>'
          +'<div class="mk-lcd"><div class="mk-full mk-shl" role="listbox">'+L.map((it,j)=>rowHtml(tr,it,j)).join('')+'</div></div></div>';
        document.body.appendChild(ov);
        const shut=()=>{ eOpen=false; ov.remove(); renderKlang(); };
        ov.querySelector('.mk-bd').onclick=shut; ov.querySelector('.mk-x').onclick=shut;
        bindRows(ov,tr,L); ov.querySelectorAll('[data-j]').forEach(b=>{ const f=b.onclick; b.onclick=e=>{ f(e); ov.remove(); }; });
        requestAnimationFrame(()=>centre(ov.querySelector('.mk-shl')));
      }
      bindRows(w,tr,L);
      ch.replaceWith(w);
    }
    if(fake){ const anchor=box.querySelector('.mk-ef')||box.querySelector('.smp-chips');
      let n=anchor.nextSibling; while(n){ const x=n.nextSibling; if(n.classList && n.classList.contains('grp')) break; n.remove(); n=x; } // Hinweise zum echten Sample weg
      const h=document.createElement('div'); h.className='kl-note';
      h.textContent='Vorschlag: '+NEW[fake][2]+' (CC0). Mehrere Töne × Lautstärken, Laden bei Wahl.'; anchor.after(h); }
  };
  const st=document.createElement('style');
  st.textContent='.mk-dot{width:7px;height:7px;border-radius:50%;background:#3fa9ff;box-shadow:0 0 6px rgba(63,169,255,.8);flex:none}'
    +'.mk-sub{flex-basis:100%;font:700 11px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:6px 0 0}.mk-sub:first-child{margin-top:0}'
    // gemeinsame Zeilen (Klappliste C + Liste D)
    +'.mk-h{font:700 11px Rajdhani,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#3a7aa8;padding:10px 12px 4px;border-bottom:1px solid rgba(63,169,255,.12)}'
    +'.mk-e{font:18px VT323,monospace;color:#3a7aa8;padding:8px 12px}'
    +'.mk-menu button,.mk-list button{width:100%;min-height:44px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:4px 12px;background:none;border:0;border-bottom:1px solid rgba(63,169,255,.08);color:var(--lcd-fg);font:21px VT323,monospace;text-align:left;cursor:pointer}'
    +'.mk-menu button span,.mk-list button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}'
    +'.mk-menu button small,.mk-list button small{font:15px VT323,monospace;color:#3a7aa8;white-space:nowrap}'
    +'.mk-ind{padding-left:30px!important}.mk-t{color:#3a7aa8!important;font-size:17px!important;min-height:36px!important}'
    +'.mk-new{font:700 10px Rajdhani,sans-serif;letter-spacing:.1em;font-style:normal;color:#3fa9ff;border:1px solid rgba(63,169,255,.5);border-radius:4px;padding:1px 4px;flex:none}'
    +'.mk-ls{margin-top:10px}.mk-ls .menu{max-height:52vh}.mk-ls .lb .x .mk-new{vertical-align:2px;margin-left:4px}'
    +'.mk-menu button.cur,.mk-list button.cur{background:var(--lcd-fg);color:#04070a}'
    +'.mk-menu button.cur small,.mk-list button.cur small,.mk-list button.cur .mk-new,.mk-menu button.cur .mk-new{color:#04070a;border-color:#04070a}'
    // D: Display
    +'.mk-lcd{background:var(--lcd-bg);border:1px solid rgba(63,169,255,.3);border-radius:10px;margin:10px 0 4px;overflow:hidden;box-shadow:inset 0 0 18px rgba(63,169,255,.06)}'
    +'.mk-top{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-bottom:1px solid rgba(63,169,255,.25)}'
    +'.mk-top .k{font:500 13px Rajdhani,sans-serif;color:var(--dim);flex:1}.mk-top b{font:400 18px VT323,monospace;color:var(--lcd-fg)}'
    +'.mk-top button{width:44px;height:40px;border-radius:8px;border:1px solid rgba(63,169,255,.25);background:none;color:var(--lcd-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}'
    +'.mk-top button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}'
    +'.mk-list{position:relative;max-height:250px;overflow-y:auto;overscroll-behavior:contain;text-shadow:0 0 6px rgba(95,194,255,.35)}'
    +'.mk-list button.cur{text-shadow:none}'
    +'.mk-rec{margin-top:6px}'
    // E1/E2
    +'.mk-ef{margin:6px 0 4px}'
    +'.mk-fld{width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:6px 14px;background:none;border:0;color:var(--lcd-fg);cursor:pointer;text-align:left}'
    +'.mk-fld .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}'
    +'.mk-fld .nm{font:24px VT323,monospace;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 6px rgba(95,194,255,.4)}'
    +'.mk-fld .nm .mk-new{vertical-align:4px;margin-left:6px;text-shadow:none}'
    +'.mk-fld .sb{font:15px VT323,monospace;color:#5b8db5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
    +'.mk-fld .mk-dimh{font:500 15px Rajdhani,sans-serif;letter-spacing:.06em;color:var(--dim);text-shadow:none}'
    +'.mk-fld svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;flex:none;opacity:.7}'
    +'.mk-ef.open{border-color:rgba(63,169,255,.5)}.mk-ef.open .mk-fld{min-height:48px;border-bottom:1px solid rgba(63,169,255,.25)}'
    +'.mk-full button{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 14px;background:none;border:0;border-bottom:1px solid rgba(63,169,255,.08);color:var(--lcd-fg);font:21px VT323,monospace;text-align:left;cursor:pointer}'
    +'.mk-full button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}'
    +'.mk-full button small{font:15px VT323,monospace;color:#5b8db5;white-space:nowrap}'
    +'.mk-full button.cur{background:var(--lcd-fg);color:#04070a}.mk-full button.cur small,.mk-full button.cur .mk-new{color:#04070a;border-color:#04070a}'
    +'.mk-full .mk-h{color:#5b8db5}'
    +'.mk-full .mk-r{justify-content:flex-start;color:var(--blue-2);font:700 15px Rajdhani,sans-serif;letter-spacing:.04em;border-bottom:0;border-top:1px dashed rgba(63,169,255,.3)}'
    +'.mk-full .mk-r svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}'
    +'.mk-ef{position:relative;overflow:visible}'
    +'.mk-pop{position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:40;max-height:min(330px,48vh);overflow-y:auto;overscroll-behavior:contain;background:var(--lcd-bg);border:1px solid rgba(63,169,255,.5);border-radius:10px;box-shadow:0 14px 34px #000d}'
    +'#mkPick{position:fixed;inset:0;z-index:300}'
    +'#mkPick .mk-bd{position:absolute;inset:0;background:#000a}'
    +'#mkPick .mk-sh{position:absolute;left:0;right:0;bottom:0;max-height:72vh;display:flex;flex-direction:column;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel,#121419);border-top:1px solid rgba(63,169,255,.35);border-radius:18px 18px 0 0}'
    +'#mkPick .mk-shh{display:flex;align-items:center;justify-content:space-between;min-height:44px}'
    +'#mkPick .mk-shh b{font:700 19px Rajdhani,sans-serif;color:var(--white)}'
    +'#mkPick .mk-x{width:44px;height:44px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:var(--panel);color:var(--blue-2);font-size:15px;cursor:pointer}'
    +'#mkPick .mk-lcd{margin:0;min-height:0;display:flex}'
    +'#mkPick .mk-shl{flex:1;overflow-y:auto;overscroll-behavior:contain}';
  document.head.appendChild(st);
  document.addEventListener('click',e=>{ if(V==='g' && eOpen && !e.target.closest('.mk-ef')){ eOpen=false; renderKlang(); } });
  document.addEventListener('scroll',e=>{ if(V==='g' && eOpen && !(e.target.closest&&e.target.closest('.mk-pop'))){ eOpen=false; renderKlang(); } },true); // Seite scrollt = zu
  function setV(v){ V=v; eOpen=false; const o=document.getElementById('mkPick'); if(o) o.remove(); if($id('klSheet').classList.contains('open')) renderKlang(); }
  function open(){
    if(isPlaying) stop(); closeSheets(); if(prIsOpen()) prClose();
    let tr=TRACKS.find(t=>trInstKey(t)==='sampler');
    if(!tr){ if(melCount()>=MEL_MAX){ hmToast('Höchstens '+MEL_MAX+' Melodiespuren',false); return; } tr=trAddNew({k:'sampler', label:melSuggest('SAMPLER')}); }
    setTimeout(()=>openKlang(tr,'sound'),80);
  }
  window.__mk={setV,open};
}

// ===== Rahmen-Steuerung =====
const fR=document.getElementById('fR');
let V='g';
function hook(){ const w=fR.contentWindow; try{ if(!w||w.eval('typeof TRACKS')!=='object') return null; if(!w.__mk) w.eval('('+MK.toString()+')()'); }catch(e){ console.error(e); return null; } return w.__mk; }
function apply(){ const m=hook(); if(m) m.setV(V); document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V)); }
fR.addEventListener('load',()=>setTimeout(()=>{ apply(); const m=hook(); if(m) m.open(); },900));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ V=b.dataset.v; apply(); });
document.getElementById('exBtn').onclick=()=>{ const m=hook(); if(m) m.open(); };
const notes=document.getElementById('notes').innerHTML; document.getElementById('side').innerHTML=notes; const info=document.getElementById('info'); info.innerHTML=notes;
document.getElementById('infoBtn').onclick=()=>info.classList.toggle('open');
const fitTop=()=>{ const h=document.getElementById('mbar').offsetHeight; document.getElementById('stage').style.top=h+'px'; info.style.top=h+'px'; }; addEventListener('resize',fitTop); fitTop();
</script>
