<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stücke auf Tasten (#76)</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
/* Mockup zu Issue #76: geschnittene Stücke als Sampler-Spur „Stücke“, eine Notenspur (Note n = Stück n+1) mit drei
   umschaltbaren Ansichten. Die echte App läuft im Rahmen; Spur, Ansichten und Stimme werden zur Laufzeit eingehängt. */
:root{color-scheme:dark;--bg:#050507;--blue:#3fa9ff;--blue-2:#8fd4ff;--white:#f4f5f7;--dim:#7d818c;--metal:#c7cbd4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',system-ui,sans-serif}
#mbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:repeating-linear-gradient(135deg,#0b1622 0 8px,#0d1a28 8px 16px);border-bottom:1px dashed rgba(63,169,255,.45);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2)}
#mbar button{height:30px;padding:0 9px;border-radius:6px;border:1px solid rgba(63,169,255,.45);background:rgba(63,169,255,.12);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2);cursor:pointer}
#mbar .sp{flex:1}
#stage{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;gap:28px;overflow:auto}
.ph{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;width:100%}
iframe{border:0;width:100%;height:100%;background:#050507;display:block}
#side{display:none;width:340px;font-size:14px;color:var(--metal);line-height:1.45;padding-top:20px}
#side h3,#info h3{font:700 11px 'Rajdhani';letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
#side p,#info p{margin:0 0 8px} #side b,#info b{color:var(--white)}
#side ul,#info ul{margin:0 0 8px;padding-left:18px} #side li,#info li{margin:3px 0}
#info{position:fixed;inset:44px 0 0 0;z-index:190;background:#07080bf2;overflow:auto;padding:8px 18px 40px;font-size:14.5px;color:var(--metal);line-height:1.45;display:none}
#info.open{display:block}
@media (min-width:900px) and (min-height:900px){
  #stage{padding:14px 0}
  .ph{width:auto;height:auto}
  iframe{width:390px;height:844px;border-radius:30px;border:8px solid #1a1e26;box-shadow:0 30px 80px rgba(0,0,0,.75);box-sizing:content-box}
  #side{display:block} #infoBtn{display:none}
}
</style>
</head>
<body>
<div id="mbar">
  <span>#76 Stücke auf Tasten</span>
  <span class="sp"></span>
  <button id="exBtn">Neu anlegen</button>
  <button id="infoBtn">ⓘ</button>
</div>
<div id="stage">
  <div class="ph"><iframe id="fR" src="../../index.html" title="App mit Vorschlag"></iframe></div>
  <div id="side"></div>
</div>
<div id="info"></div>
<template id="notes">
  <h3>Schritt 1: Stücke auf die Tasten</h3>
  <p>Nichts Neues an Fenstern. Die <b>Sampler-Spur</b> bekommt in der Sound-Auswahl unter einem geschnittenen Sample den Eintrag <b>„Alle Stücke auf Tasten“</b>. Dann liegt Stück 1 auf C3, Stück 2 auf C♯3 und so weiter, jedes in Originaltonhöhe.</p>
  <p>Eingezeichnet wird in der <b>Piano Roll, die es schon gibt</b>. Sie zeigt dann nur die belegten Tasten, links steht die Stück-Nummer statt des Tonnamens. Antippen spielt das Stück an.</p>
  <h3>Ausprobieren</h3>
  <ul>
    <li>Spur <b>BREAK</b> ist angelegt und spielt den Original-Groove. Auf die Vorschau tippen, dann öffnet sich die Piano Roll.</li>
    <li>Klang → Sound: unter „Eigene“ steht der neue Eintrag.</li>
    <li>Andere Sampler-Spuren sind unverändert.</li>
  </ul>
  <h3>Später (eigene Schritte)</h3>
  <ul>
    <li><b>Pads</b> spielen die gewählte Spur und können auf sie aufnehmen.</li>
    <li>Ob Drum-Zeilen auch in der Piano Roll gehen, entscheiden wir danach.</li>
  </ul>
  <h3>Im Mockup nicht drin</h3>
  <ul><li>Echtes Sample aus der Bibliothek (hier ein erzeugter Break), Speichern.</li></ul>
</template>
<script>
// ===== Läuft im globalen Scope der App (per eval im Rahmen) =====
function MK(){
  if(window.__mk) return;
  const N=12, KEY='cut:demo';
  // ---- Demo-Break: 1 Takt bei 120 BPM, 12 Schläge auf 16tel; Schnitt an jedem Schlag (steht für ein geschnittenes Sample aus der Bibliothek) ----
  const HITS=[[0,'k'],[2,'h'],[3,'k'],[4,'s'],[6,'h'],[7,'g'],[8,'k'],[10,'k'],[11,'h'],[12,'s'],[14,'h'],[15,'o']];
  function brk(){
    const sr=audioCtx.sampleRate, st=0.125, n=Math.round(sr*2), b=audioCtx.createBuffer(1,n,sr), d=b.getChannelData(0);
    let z=987; const rnd=()=>{ z=(z*1103515245+12345)%2147483648; return z/1073741824-1; };
    const F={k:t=>Math.sin(2*Math.PI*(48*t+110*0.035*(1-Math.exp(-t/0.035))))*Math.exp(-t/0.2)*1.1,
      s:t=>(rnd()*0.75+Math.sin(2*Math.PI*185*t)*0.55)*Math.exp(-t/0.1), g:t=>(rnd()*0.4+Math.sin(2*Math.PI*190*t)*0.25)*Math.exp(-t/0.05),
      h:t=>rnd()*Math.exp(-t/0.022)*0.38, o:t=>rnd()*Math.exp(-t/0.16)*0.33};
    HITS.forEach(([s,k])=>{ const a=Math.round(s*st*sr); for(let i=0;i<0.5*sr && a+i<n;i++) d[a+i]+=F[k](i/sr); });
    let pk=0; for(let i=0;i<n;i++) pk=Math.max(pk,Math.abs(d[i])); for(let i=0;i<n;i++) d[i]*=0.85/pk;
    return {buf:b, cuts:HITS.map(([s])=>s*st)};
  }
  const B=brk();
  // Neuer Sound-Eintrag: alle Stücke eines geschnittenen Samples auf Tasten (Stück 1 = C3, je Halbton das nächste)
  SMPL[KEY]={name:'Break · 12 Stücke', state:'ok', cut:true, buf:B.buf, cuts:B.cuts, mode:'oneshot'};
  const isCut=tr=>tr && trInstKey(tr)==='sampler' && tr.smp===KEY;
  const ROOT=48-45; // rootNote so, dass n=0 → MIDI 48 (C3)
  const oVoice=samplerVoice;
  samplerVoice=function(tr,time,n,vel,hold){ if(!isCut(tr)) return oVoice(tr,time,n,vel,hold);
    const S=SMPL[KEY]; if(!audioCtx||!tr.bus||n<0||n>=N) return null;
    const a=S.cuts[n], L=(n<N-1?S.cuts[n+1]:S.buf.duration)-a, src=audioCtx.createBufferSource(), g=audioCtx.createGain(), pk=Math.max(0.05,Math.min(1.3,vel))*tr.vol;
    src.buffer=S.buf; g.gain.setValueAtTime(0,time); g.gain.linearRampToValueAtTime(pk,time+0.0015); g.gain.setValueAtTime(pk,time+L-0.003); g.gain.linearRampToValueAtTime(0,time+L);
    src.connect(g).connect(tr.bus); src.start(time,a,L); src.onended=()=>{ try{ g.disconnect(); }catch(e){} }; return {rel(){}}; };
  // Sound-Auswahl: unter „Eigene“ der neue Eintrag
  const oItems=smpPickItems;
  smpPickItems=function(tr){ const L=oItems(tr), i=L.findIndex(x=>x.h==='Eigene');
    L.splice(i+1,0,{k:'lib:demo', name:'Break'},{t:'demo-x', open:true, name:'▾ 12 Stücke'},{k:KEY, name:'Alle Stücke auf Tasten', sub:'ab C3', ind:1});
    return L.filter(x=>x.k!=='lib:demo'||true); };
  const oPick=samplerPick;
  samplerPick=async function(tr,key,q){ if(key!==KEY) return oPick(tr,key,q); tr.smp=KEY; tr.rootNote=ROOT; samplerChanged&&samplerChanged(); renderKlang(); if(prIsOpen()) prRenderChrome(); if(!q) samplerVoice(tr,audioCtx.currentTime+0.01,0,0.9); };
  // Piano Roll: bei Stücken nur die belegten Tasten als Zeilen, links Stück-Nummer statt Tonname
  const oRows=prRows; prRows=tr=>{ if(!isCut(tr)) return oRows(tr); const o=[]; for(let n=N-1;n>=0;n--) o.push(n); return o; };
  const oIn=pitchInScale; pitchInScale=(v,tr)=>isCut(tr)||isCut(prTr) ? true : oIn(v,tr);
  const oKeys=prKeysHtml; prKeysHtml=(tr,v)=>{ if(!isCut(tr)) return oKeys(tr,v); let h='';
    prR.forEach((n,i)=>{ h+='<div class="pkl w" data-n="'+n+'" style="top:'+(i*v.rh)+'px;height:'+v.rh+'px"></div><div class="pkn" style="top:'+(i*v.rh)+'px;height:'+v.rh+'px;color:#8be86a;font-weight:700;left:0;right:auto;width:100%;text-align:center">'+(n+1)+'</div>'; });
    return h; };
  function groove(tr){ tr.events=[]; for(let p=0;p<PATTERN_LENGTH;p+=16) HITS.forEach(([s],i)=>tr.events.push({s:s+p,n:i,l:1,v:i===5?0.45:0.9})); evTouch(tr); }
  function make(){
    if(isPlaying) stop(); closeSheets(); if(prIsOpen()) prClose();
    let tr=TRACKS.find(isCut);
    if(!tr){ if(melCount()>=MEL_MAX){ hmToast('Höchstens '+MEL_MAX+' Melodiespuren',false); return; }
      tr=trCreate('sampler',{label:melSuggest('BREAK')}); tr.smp=KEY; tr.rootNote=ROOT; tr.harm=hmDefaultTrack(tr); tr.harmOwn=null; trAttach(tr,null); }
    groove(tr); melChanged(tr);
  }
  window.__mk={make};
}

// ===== Rahmen-Steuerung =====
const fR=document.getElementById('fR');
function hook(){ const w=fR.contentWindow; try{ if(!w||w.eval('typeof TRACKS')!=='object') return null; if(!w.__mk) w.eval('('+MK.toString()+')()'); }catch(e){ console.error(e); return null; } return w.__mk; }
function boot(){ const w=fR.contentWindow; Promise.resolve(w.eval('initAudio()')).catch(()=>{}).then(()=>{ const m=hook(); if(m) m.make(); }); }
fR.addEventListener('load',()=>setTimeout(boot,800));
document.getElementById('exBtn').onclick=()=>{ const m=hook(); if(m) m.make(); };
const notes=document.getElementById('notes').innerHTML; document.getElementById('side').innerHTML=notes; const info=document.getElementById('info'); info.innerHTML=notes;
document.getElementById('infoBtn').onclick=()=>info.classList.toggle('open');
const fitTop=()=>{ const h=document.getElementById('mbar').offsetHeight; document.getElementById('stage').style.top=h+'px'; info.style.top=h+'px'; }; addEventListener('resize',fitTop); fitTop();
</script>
</body>
</html>
