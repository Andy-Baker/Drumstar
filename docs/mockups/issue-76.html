<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Stücke auf Tasten (#76)</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
/* Mockup zu Issue #76: geschnittene Stücke als Sampler-Spur „Stücke“, eine Notenspur (Note n = Stück n+1) mit drei
   umschaltbaren Ansichten. Die echte App läuft im Rahmen; Spur, Ansichten und Stimme werden zur Laufzeit eingehängt. */
:root{color-scheme:dark;--bg:#050507;--blue:#3fa9ff;--blue-2:#8fd4ff;--white:#f4f5f7;--dim:#7d818c;--metal:#c7cbd4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:var(--bg);color:var(--white);font-family:'Rajdhani',system-ui,sans-serif}
#mbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px;background:repeating-linear-gradient(135deg,#0b1622 0 8px,#0d1a28 8px 16px);border-bottom:1px dashed rgba(63,169,255,.45);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2)}
#mbar button{height:30px;padding:0 9px;border-radius:6px;border:1px solid rgba(63,169,255,.45);background:rgba(63,169,255,.12);font:700 11px 'JetBrains Mono',monospace;color:var(--blue-2);cursor:pointer}
#mbar .sp{flex:1}

<body>
<div id="mbar">
  <span>#76</span>
  <span class="sp"></span>
  <button data-go="editor">Schneiden</button><button data-go="roll">Roll</button><button data-go="kbd">Tasten</button><button data-go="klang">Klang</button>
  <button id="infoBtn">ⓘ</button>
</div>
<div id="stage">
  <div class="ph"><iframe id="fR" src="../../index.html" title="App mit Vorschlag"></iframe></div>
  <div id="side"></div>
</div>
<div id="info"></div>
<template id="notes">
  <h3>Die Idee</h3>
  <p>Die <b>Sampler-Spur</b> kann statt eines gestimmten Samples eine <b>Tastenbelegung</b> haben: jede Taste ihr eigenes Sample. Bearbeitet wird nur <b>in der Piano Roll</b>. Der Spielmodus bleibt zum Spielen, dort ändert Halten nichts.</p>
  <h3>In der Piano Roll, Klaviatur links</h3>
  <ul>
    <li><b>Tippen</b> = anhören (wie bisher).</li>
    <li><b>Halten</b> = Taste-Sheet: Welle, <b>Liegt auf ‹ E3 ›</b> (genau Taste für Taste verschieben), Anderes Sample, Bearbeiten, Taste leeren.</li>
    <li><b>Halten und ziehen</b> = verschieben. Für große Finger:
      <ul>
        <li>Der Balken über die ganze Breite zeigt das Ziel rechts neben dem Finger, nicht darunter: „→ G3 · tauscht mit Break 7“.</li>
        <li>Ziehen ist <b>relativ</b>: eine Zeile je Zeilenhöhe, egal wo der Finger genau liegt. Jede neue Zeile tickt kurz.</li>
        <li>Am oberen und unteren Rand scrollt die Ansicht mit.</li>
        <li>Die Noten wandern mit, eine belegte Taste wird getauscht (gelber Balken). Rückgängig im Hinweis.</li>
      </ul></li>
    <li><b>Leere Taste halten</b> = Sample wählen, auch „Alle Stücke ab hier“.</li>
    <li>Belegte Tasten tragen ein grünes Schild, unbelegte Zeilen sind dunkel. Mehr Platz zum Treffen gibt es per Zoom (zwei Finger).</li>
  </ul>
  <h3>Wie die Samples hinkommen</h3>
  <ul>
    <li><b>Schneiden</b> im Sample-Editor, Chip <b>„Stücke → Tasten“</b>, danach geht die Piano Roll auf.</li>
    <li><b>Leere Taste halten</b> (siehe oben).</li>
  </ul>
  <h3>Klang → Sound</h3>
  <ul>
    <li>LCD-Feld „Tastenbelegung · 12 Samples · C3–B3“. Umschalten über die Sound-Auswahl (oben „Jede Taste eigenes Sample“), die Belegung bleibt gespeichert.</li>
    <li>Mini-Klaviatur als Überblick und <b>„In der Piano Roll bearbeiten“</b>.</li>
  </ul>
  <h3>Bewusst nicht drin</h3>
  <ul><li>Sample direkt aufnehmen (#78), Pads aufnehmen (#77), Stimmung/Lautstärke je Taste.</li><li>Mockup: der Break ist erzeugt, nichts wird in der Bibliothek gespeichert.</li></ul>
</template>
<script>
// ===== Läuft im globalen Scope der App (per eval im Rahmen) =====
function MK(){
  if(window.__mk) return;
  const G='#8be86a', ROOT=3; // rootNote 3: Note 0 = C3
  // ---- Demo-Break (steht für einen geladenen Loop): 1 Takt bei 120 BPM ----
  const HITS=[[0,'k'],[2,'h'],[3,'k'],[4,'s'],[6,'h'],[7,'g'],[8,'k'],[10,'k'],[11,'h'],[12,'s'],[14,'h'],[15,'o']];
  function brk(){
    const sr=audioCtx.sampleRate, st=0.125, n=Math.round(sr*2), b=audioCtx.createBuffer(1,n,sr), d=b.getChannelData(0);
    let z=987; const rnd=()=>{ z=(z*1103515245+12345)%2147483648; return z/1073741824-1; };
    const F={k:t=>Math.sin(2*Math.PI*(48*t+110*0.035*(1-Math.exp(-t/0.035))))*Math.exp(-t/0.2)*1.1,
      s:t=>(rnd()*0.75+Math.sin(2*Math.PI*185*t)*0.55)*Math.exp(-t/0.1), g:t=>(rnd()*0.4+Math.sin(2*Math.PI*190*t)*0.25)*Math.exp(-t/0.05),
      h:t=>rnd()*Math.exp(-t/0.022)*0.38, o:t=>rnd()*Math.exp(-t/0.16)*0.33};
    HITS.forEach(([s,k])=>{ const a=Math.round(s*st*sr); for(let i=0;i<0.5*sr && a+i<n;i++) d[a+i]+=F[k](i/sr); });
    let pk=0; for(let i=0;i<n;i++) pk=Math.max(pk,Math.abs(d[i])); for(let i=0;i<n;i++) d[i]*=0.85/pk;
    return b;
  }
  const BRK=brk(), BCUT=HITS.map(([s])=>s*0.125);
  const BREAK_SL=BCUT.map((t,i)=>({name:'Break '+(i+1), tag:String(i+1), buf:seCutPiece(BRK,t,i<BCUT.length-1?BCUT[i+1]:BRK.duration)}));
  // ---- Datenmodell: Sampler-Spur, Art „Tasten“ = jede Taste ihr eigenes Sample (tr.smpKeys[n]); tr.smp bleibt für „Ein Sample“ ----
  const isKeys=tr=>!!(tr && trInstKey(tr)==='sampler' && tr.smpArt==='keys');
  const K=tr=>tr.smpKeys||(tr.smpKeys={});
  const keyList=tr=>Object.keys(K(tr)).map(Number).sort((x,y)=>x-y);
  const noteName=(tr,n)=>pitchNoteName(tr,n).replace('#','♯');
  const range=tr=>{ const l=keyList(tr); return l.length ? noteName(tr,l[0])+'–'+noteName(tr,l[l.length-1]) : ''; };
  function setKeys(tr){ tr.smpArt='keys'; tr.rootNote=ROOT; }
  function putList(tr,list,from){ let n=from; const a=n; list.forEach(e=>{ K(tr)[n]={...e}; n++; }); return [a,n-1]; }
  // Verschieben: Sample samt Noten auf Taste b; belegt b schon etwas, tauschen beide
  function moveKey(tr,a,b){ if(a===b) return; const ea=K(tr)[a], eb=K(tr)[b];
    if(eb) K(tr)[a]=eb; else delete K(tr)[a]; K(tr)[b]=ea;
    tr.events.forEach(x=>{ if(x.n===a) x.n=b; else if(eb && x.n===b) x.n=a; }); evTouch(tr); }
  // Stimme
  const oVoice=samplerVoice;
  samplerVoice=function(tr,time,n,vel,hold){ if(!isKeys(tr)) return oVoice(tr,time,n,vel,hold);
    const e=K(tr)[n]; if(!e || !audioCtx || !tr.bus) return null;
    const src=audioCtx.createBufferSource(), g=audioCtx.createGain(), pk=Math.max(0.05,Math.min(1.3,vel))*tr.vol, L=Math.min(e.buf.duration,4);
    src.buffer=e.buf; g.gain.setValueAtTime(pk,time); g.gain.setValueAtTime(pk,time+L-0.004); g.gain.linearRampToValueAtTime(0,time+L);
    src.connect(g).connect(tr.bus); src.start(time,0,L); src.onended=()=>{ try{ g.disconnect(); }catch(er){} }; return {rel(){}}; };
  const hear=(tr,n)=>Promise.resolve(initAudio()).then(()=>{ if(audioCtx.state!=='running') audioCtx.resume(); samplerVoice(tr,audioCtx.currentTime+0.006,n,0.9); });
  const oSub=samplerSub; samplerSub=tr=>isKeys(tr) ? 'Tasten · '+keyList(tr).length+' belegt' : oSub(tr);
  const oIn=pitchInScale; pitchInScale=(v,tr)=>isKeys(tr) ? !!K(tr)[v] : oIn(v,tr);
  function wave(cv,buf){ const x=cv.getContext('2d'), d=buf.getChannelData(0), W=cv.width, H=cv.height, L=d.length; x.clearRect(0,0,W,H); x.fillStyle=G;
    for(let i=0;i<W;i++){ let m=0; const s=Math.floor(i*L/W), e=Math.floor((i+1)*L/W); for(let j=s;j<e;j+=2) m=Math.max(m,Math.abs(d[j])); const h=Math.max(1,m*H*0.95); x.fillRect(i,(H-h)/2,1,h); } }
  function refresh(tr){ samplerChanged&&samplerChanged(); if(prIsOpen()){ prRender(); prRenderChrome(); } if(klTr===tr) renderKlang(); try{ prDrawPreview(tr); ovRender(); }catch(er){} }
  // ---- Piano Roll: Klaviatur bleibt, belegte Tasten tragen ein grünes Schild ----
  const oKeys=prKeysHtml;
  prKeysHtml=(tr,v)=>{ let h=oKeys(tr,v); if(!isKeys(tr)) return h;
    prR.forEach((n,i)=>{ const e=K(tr)[n]; if(e) h+='<div class="mk-bd" data-bn="'+n+'" style="top:'+(i*v.rh+Math.max(1,(v.rh-18)/2))+'px">'+e.tag+'</div>'; });
    return h+'<div id="mkDropRow"></div>'; };
  const oKb=prBuildKb; prBuildKb=function(){ oKb(); const tr=prTr; if(!isKeys(tr)) return;
    $id('prKb').querySelectorAll('[data-n]').forEach(k=>{ const e=K(tr)[+k.dataset.n]; if(e){ const b=document.createElement('i'); b.className='mk-kb'; b.dataset.bn=k.dataset.n; b.textContent=e.tag; k.appendChild(b); } }); };
  [['prFitView'],['prFitKb']].forEach(([f])=>{ const o=window[f]; window[f]=function(){ const tr=prTr||arguments[0]; if(!isKeys(tr)) return o.apply(this,arguments);
    const ev=tr.events; tr.events=ev.concat(keyList(tr).map(n=>({s:0,n,l:1,v:0}))); try{ return o.apply(this,arguments); } finally{ tr.events=ev; } }; });
  // ---- Geste an der Klaviatur links (nur Piano Roll; der Spielmodus bleibt zum Spielen) ----
  //   tippen = anhören (wie bisher) · halten = Taste-Sheet (leer: Sample wählen) · halten und ziehen = verschieben
  //   Ziehen ist relativ (eine Zeile je Zeilenhöhe, egal wo der Finger liegt), die Zielzeile wird über die ganze Breite markiert
  //   und beschriftet (rechts vom Finger, nicht darunter), jede neue Zeile tickt kurz, am Rand scrollt die Ansicht mit.
  let gs=null, bar=null;
  function gsDown(e){ if(!isKeys(prTr)) return; const r=$id('prLbl').getBoundingClientRect(), v=prV(prTr), i=Math.floor((e.clientY-r.top)/v.rh);
    if(i<0 || i>=prR.length) return; gsEnd(); gs={pid:e.pointerId, i, n:prR[i], y:e.clientY, x:e.clientX, sy0:v.sy, ph:'wait', t:setTimeout(gsHold,420)}; }
  function gsHold(){ if(!gs) return; gs.ph='held'; tick(14); lift(gs.n,true); }
  const tick=ms=>{ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(er){} };
  function lift(n,on){ document.querySelectorAll('.mk-lift').forEach(x=>x.classList.remove('mk-lift')); if(!on) return;
    const b=document.querySelector('#prLbl [data-bn="'+n+'"]'); if(b) b.classList.add('mk-lift'); }
  function showBar(i){ const tr=prTr, v=prV(tr), vr=prView.getBoundingClientRect(), lr=$id('prLblCol').getBoundingClientRect();
    if(!bar){ bar=document.createElement('div'); bar.id='mkBar'; document.body.appendChild(bar); }
    const top=vr.top+i*v.rh-v.sy; bar.style.display='flex'; bar.style.left=lr.left+'px'; bar.style.width=(vr.right-lr.left)+'px';
    bar.style.top=Math.max(vr.top,top)+'px'; bar.style.height=Math.max(0,Math.min(top+v.rh,vr.bottom)-Math.max(vr.top,top))+'px';
    const n=prR[i], src=K(tr)[gs.n], o=K(tr)[n], same=n===gs.n;
    bar.classList.toggle('sw',!!o && !same);
    bar.innerHTML='<b class="mk-tg">'+src.tag+'</b><span>'+(same ? 'Ziehen zum Verschieben' : '→ '+noteName(tr,n)+(o ? ' · tauscht mit '+o.name : ''))+'</span>'; }
  function gsMove(e){ if(!gs || e.pointerId!==gs.pid) return; const far=Math.hypot(e.clientX-gs.x,e.clientY-gs.y)>9;
    if(gs.ph==='wait'){ if(far) gsEnd(); return; }
    e.stopPropagation(); e.preventDefault(); gs.cy=e.clientY;
    if(gs.ph==='held' && far && K(prTr)[gs.n]){ gs.ph='drag'; gs.to=gs.i; showBar(gs.i); edge(); }
    if(gs.ph==='drag') aim(); }
  function aim(){ const v=prV(prTr), i=Math.max(0,Math.min(prR.length-1,gs.i+Math.round((gs.cy-gs.y+(v.sy-gs.sy0))/v.rh)));
    if(i!==gs.to){ gs.to=i; tick(6); } showBar(i); }
  function edge(){ if(!gs || gs.ph!=='drag') return; const vr=prView.getBoundingClientRect(), v=prV(prTr), z=56;
    const d=gs.cy<vr.top+z ? -(vr.top+z-gs.cy) : gs.cy>vr.bottom-z ? gs.cy-(vr.bottom-z) : 0;
    if(d){ const sy=v.sy; v.sy+=d*0.25; prClamp(v); if(v.sy!==sy){ prRender(); aim(); } }
    gs.raf=requestAnimationFrame(edge); }
  function gsUp(e){ if(!gs || e.pointerId!==gs.pid) return; const g=gs; gsEnd();
    if(g.ph==='wait') return; e.stopPropagation(); const tr=prTr;
    if(g.ph==='held'){ keyOpen(tr,g.n); return; }
    const b=prR[g.to]; if(b==null || b===g.n) return; move(tr,g.n,b); }
  function move(tr,a,b){ const sw=K(tr)[b], nm=K(tr)[a].name; moveKey(tr,a,b); refresh(tr); hear(tr,b);
    hmToast(nm+' → '+noteName(tr,b)+(sw?' (getauscht)':''),true,()=>{ moveKey(tr,b,a); refresh(tr); if(sh.classList.contains('open')) keyOpen(tr,a); }); }
  function gsEnd(){ if(!gs) return; clearTimeout(gs.t); cancelAnimationFrame(gs.raf); gs=null; lift(0,false); if(bar) bar.style.display='none'; }
  $id('prLblCol').addEventListener('pointerdown',gsDown);
  window.addEventListener('pointermove',gsMove,true);
  window.addEventListener('pointerup',gsUp,true);
  window.addEventListener('pointercancel',()=>gsEnd(),true);
  $id('prLblCol').addEventListener('contextmenu',e=>e.preventDefault());
  // ---- Taste-Sheet ----
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='mkKeySh';
  sh.innerHTML='<div class="sh"><span id="mkKeyT"></span><button class="shx" id="mkKeyX" aria-label="Schließen">✕</button></div><div id="mkKeyB" class="mk-ks"></div>';
  document.body.appendChild(sh);
  const oClose=closeSheets; closeSheets=function(){ oClose(); sh.classList.remove('open'); };
  $id('mkKeyX').onclick=closeSheets;
  function keyOpen(tr,n){ const e=K(tr)[n];
    if(!e){ pickFor(tr,n); return; }
    $id('mkKeyT').textContent='Taste '+noteName(tr,n);
    const B=$id('mkKeyB'); B.innerHTML='';
    // Karte: Sample + Welle (antippen = hören)
    const w=document.createElement('button'); w.className='mk-wv'; w.setAttribute('aria-label','Anhören');
    w.innerHTML='<div class="mk-wh"><b class="mk-tg">'+e.tag+'</b><span class="mk-wn"></span><span class="mk-pl"><svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="8,5 19,12 8,19" fill="currentColor"/></svg></span></div><canvas width="600" height="96"></canvas>';
    w.querySelector('.mk-wn').textContent=e.name; wave(w.querySelector('canvas'),e.buf); w.onclick=()=>hear(tr,n); B.appendChild(w);
    // Taste wechseln: große Schritt-Tasten (genauer als Ziehen)
    const mv=document.createElement('div'); mv.className='mk-mv';
    const o=d=>K(tr)[n+d];
    mv.innerHTML='<span class="mk-ml">Liegt auf</span><button data-d="-1" aria-label="Eine Taste tiefer"><svg class="uic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>'+noteName(tr,n)+'</b><button data-d="1" aria-label="Eine Taste höher"><svg class="uic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>';
    mv.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ const t=n+(+b.dataset.d); move(tr,n,t); keyOpen(tr,t); });
    B.appendChild(mv);
    const a=document.createElement('div'); a.className='mk-row2';
    a.innerHTML='<button class="act" data-x="pick"><svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Anderes Sample</button><button class="act" data-x="edit">'+UI_IC.trim+'Bearbeiten</button>';
    B.appendChild(a);
    const c=document.createElement('button'); c.className='mk-clr'; c.innerHTML=UI_IC.del+'Taste leeren'; B.appendChild(c);
    a.querySelector('[data-x=pick]').onclick=()=>pickFor(tr,n);
    a.querySelector('[data-x=edit]').onclick=()=>hmToast('Öffnet „'+e.name+'“ im Sample-Editor (Trimmen, Tonhöhe …)',false);
    c.onclick=()=>{ delete K(tr)[n]; refresh(tr); closeSheets(); hmToast('Taste '+noteName(tr,n)+' geleert',true,()=>{ K(tr)[n]=e; refresh(tr); }); };
    if(!sh.classList.contains('open')) openSheet('mkKeySh');
  }
  // ---- Sound-Auswahl (vorhandenes Fenster) ----
  //   normal: oben neuer Eintrag „Jede Taste eigenes Sample“ · für eine Taste: einzelne Samples und „Alle Stücke ab hier“
  let pick=null; // {tr, n}
  function pickFor(tr,n){ closeSheets(); pick={tr,n}; smpPickOpen(tr); }
  const oItems=smpPickItems;
  smpPickItems=function(tr){
    if(!pick){ const L=oItems(tr), on=isKeys(tr);
      return [{h:'Belegung'},{k:on?tr.smp+'#':'mk:keys', name:'Jede Taste eigenes Sample', sub:on?'aktiv · '+keyList(tr).length+' belegt':'z. B. Stücke eines Loops'}].concat(L); }
    const nn=noteName(tr,pick.n), L=[{h:'Synth'}];
    Object.keys(SMP_WERK).forEach(k=>L.push({k:'mk:w:'+k, name:SMP_WERK[k].name, sub:SMP_WERK[k].desc}));
    L.push({h:'Eigene'},{k:'mk:brk:all', name:'Break', sub:'ganzer Loop'},{t:'mkb', open:true, name:'▾ '+BREAK_SL.length+' Stücke'},
      {k:'mk:brk:sl', name:'Alle '+BREAK_SL.length+' Stücke', sub:'ab '+nn, ind:1});
    BREAK_SL.forEach((e,i)=>L.push({k:'mk:s:'+i, name:e.name, ind:1}));
    L.push({r:1, name:'Aufnehmen / Laden'}); return L;
  };
  const oRender=smpPickRender; smpPickRender=function(){ oRender(); const t=$id('smpPick').querySelector('.ovt span, .sh span, h2, .ovt b');
    if(t){ if(!t.dataset.o) t.dataset.o=t.textContent; t.textContent=pick ? 'Sample für Taste '+noteName(pick.tr,pick.n) : t.dataset.o; }
    if(!pick && isKeys(smpPickTr)){ const c=$id('smpPickList').querySelector('[data-k$="#"]'); if(c) c.classList.add('cur'); $id('smpPickList').querySelectorAll('.cur').forEach(x=>{ if(!x.dataset.k.endsWith('#')) x.classList.remove('cur'); }); } };
  const oPClose=smpPickClose; smpPickClose=function(){ oPClose(); setTimeout(()=>{ if(!$id('smpPick').classList.contains('open')) pick=null; },0); };
  const oPick=samplerPick;
  samplerPick=async function(tr,key,q){
    const P=pick; pick=null;
    if(String(key).endsWith('#')) return; // schon aktiv
    if(key==='mk:keys'){ setKeys(tr); refresh(tr); closeSheets();
      if(!keyList(tr).length){ openRoll(tr); hmToast('Links eine Taste halten = Sample wählen',false); } return; }
    if(!P){ if(isKeys(tr)){ tr.smpArt=null; hmToast('Tastenbelegung bleibt gespeichert',false); } return oPick(tr,key,q); }
    if(key==='mk:brk:sl'){ const [a,b]=putList(tr,BREAK_SL,P.n); refresh(tr); hmToast(BREAK_SL.length+' Stücke auf '+noteName(tr,a)+'–'+noteName(tr,b),false); hear(tr,a); return; }
    let e; if(key.startsWith('mk:s:')) e={...BREAK_SL[+key.slice(5)]};
    else if(key==='mk:brk:all') e={name:'Break', tag:'B', buf:BRK};
    else { const w=key.slice(5); e={name:SMP_WERK[w].name, tag:SMP_WERK[w].name[0], buf:smpWerkBuf(w)}; }
    K(tr)[P.n]=e; refresh(tr); hear(tr,P.n);
  };
  const oSE=openSampleEditor;
  openSampleEditor=async function(o){ o=o||{}; if(o.forSampler && isKeys(o.forSampler) && !o.buffer && !o.sampleId) return mkEditor(o.forSampler); return oSE(o); };
  // ---- Klang → Sound: nur Überblick; bearbeitet wird auf der Klaviatur ----
  const IS=INSTR.sampler, oKl=IS.klang;
  IS.klang=(tr,box,grp)=>{
    if(!isKeys(tr)){ oKl(tr,box,grp); return; }
    grp('Sample');
    const fld=document.createElement('button'); fld.className='smp-fld'; fld.setAttribute('aria-label','Sound wählen');
    fld.innerHTML='<span class="x"><span class="nm">Tastenbelegung</span><span class="sb"></span></span>'+FXI.dn;
    fld.querySelector('.sb').textContent=keyList(tr).length ? keyList(tr).length+' Samples · '+range(tr) : 'noch leer';
    fld.onclick=()=>smpPickOpen(tr); box.appendChild(fld);
    const l=keyList(tr);
    if(l.length){ const pc=n=>((n+9+ROOT)%12+12)%12, lo=l[0]-pc(l[0]), hi=l[l.length-1]+11-pc(l[l.length-1]);
      const kb=document.createElement('button'); kb.className='mk-ov'; kb.setAttribute('aria-label','In der Piano Roll bearbeiten');
      const blk=n=>[1,3,6,8,10].includes(pc(n)), whites=[]; for(let n=lo;n<=hi;n++) if(!blk(n)) whites.push(n);
      const W=100/whites.length; let h='';
      whites.forEach((n,i)=>{ const e=K(tr)[n]; h+='<i class="w" style="left:'+(i*W)+'%;width:'+W+'%">'+(e?'<b>'+e.tag+'</b>':'')+'</i>'; });
      for(let n=lo;n<=hi;n++){ if(!blk(n)) continue; const i=whites.indexOf(n-1), e=K(tr)[n];
        h+='<i class="k" style="left:'+((i+1)*W-W*0.32)+'%;width:'+(W*0.64)+'%">'+(e?'<b>'+e.tag+'</b>':'')+'</i>'; }
      kb.innerHTML=h; kb.onclick=()=>openRoll(tr); box.appendChild(kb); }
    const a=document.createElement('div'); a.className='acts';
    a.innerHTML='<button class="act"><svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v8M12 5v8M16 5v8"/></svg>In der Piano Roll bearbeiten</button>';
    a.querySelector('button').onclick=()=>openRoll(tr); box.appendChild(a);
    const n=document.createElement('div'); n.className='kl-note'; n.textContent='Dort an der Klaviatur links: Taste halten = ändern oder ziehen, leere Taste halten = Sample wählen.'; box.appendChild(n);
  };
  function openRoll(tr){ closeSheets(); if(!prIsOpen()) prOpen(tr); setTimeout(()=>{ prSetMode('edit'); prV(tr).fit=true; prRender(); },60); }
  function openKb(tr){ closeSheets(); if(!prIsOpen()) prOpen(tr); setTimeout(()=>{ prSetMode('play'); prK(tr).w=0; prFitKb(tr); prRender(); },60); }
  // ---- Sample-Editor · Schneiden: neuer Chip „Stücke → Tasten“ ----
  let seTarget=null;
  const chip=document.createElement('div'); chip.className='se-assign-chip on'; chip.id='mkTastChip';
  chip.innerHTML='<svg class="uic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v8M12 5v8M16 5v8"/></svg><span>Stücke → Tasten</span><small id="mkTastTo"></small>';
  $id('seSlicePadsChip').after(chip);
  chip.onclick=()=>{ chip.classList.toggle('on'); seCutDraw(); };
  const oDraw=seCutDraw; seCutDraw=function(){ oDraw.apply(this,arguments); const t=$id('mkTastTo'); if(t) t.textContent=seTarget ? trTitle(seTarget) : 'neue Spur'; };
  async function mkEditor(tr){ seTarget=tr||null; await oSE({buffer:BRK, label:'Break'}); seSetMode('slice'); seCuts=BCUT.slice(1).map(t=>seSnapZero(t)); seCutBuf=seWorkingBuffer; seCutSel=0;
    seCutToPads=false; $id('seSlicePadsChip').classList.remove('on'); chip.classList.add('on'); seCutDraw(); }
  seSaveSlices=async function(){
    const B=seCutBounds(), list=[]; for(let k=0;k<B.length-1;k++) list.push({name:'Break '+(k+1), tag:String(k+1), buf:seCutPiece(seWorkingBuffer,B[k],B[k+1])});
    closeSampleEditor();
    if(!chip.classList.contains('on')){ hmToast('Mockup: '+list.length+' Stücke nur in der Bibliothek (nicht gespeichert)',false); return; }
    let tr=seTarget && TRACKS.includes(seTarget) ? seTarget : null;
    if(!tr){ if(melCount()>=MEL_MAX){ hmToast('Höchstens '+MEL_MAX+' Melodiespuren',false); return; }
      tr=trCreate('sampler',{label:melSuggest('BREAK')}); tr.harm=hmDefaultTrack(tr); tr.harmOwn=null; trAttach(tr,null); }
    setKeys(tr); const l=keyList(tr), from=l.length ? l[l.length-1]+1 : 0; const [a,b]=putList(tr,list,from);
    melChanged(tr); refresh(tr); seTarget=null;
    hmToast(list.length+' Stücke auf '+noteName(tr,a)+'–'+noteName(tr,b)+' · '+trTitle(tr),false);
    setTimeout(()=>prOpen(tr),350);
  };
  const st=document.createElement('style');
  st.textContent='#prLbl .mk-bd{position:absolute;left:3px;z-index:3;min-width:18px;height:18px;padding:0 3px;border-radius:5px;background:'+G+';color:#0b1a07;font:700 10px "JetBrains Mono",monospace;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .12s}'
   +'.mk-kb{position:absolute;left:50%;transform:translateX(-50%);min-width:18px;height:18px;padding:0 3px;border-radius:5px;background:'+G+';color:#0b1a07;font:700 10px "JetBrains Mono",monospace;font-style:normal;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .12s}'
   +'.pkw .mk-kb{bottom:38px}.pkb .mk-kb{bottom:10px}'
   +'.mk-bd.mk-lift{transform:scale(1.35);box-shadow:0 0 0 3px #0b1a07,0 0 12px '+G+'}.mk-kb.mk-lift{transform:translateX(-50%) scale(1.35);box-shadow:0 0 12px '+G+'}'
   +'.pkl.mk-lift,.pkw.mk-lift,.pkb.mk-lift{outline:2px solid '+G+';outline-offset:-2px}.pkw.mk-tgt,.pkb.mk-tgt{outline:3px dashed '+G+';outline-offset:-3px}'
   +'#mkDropRow{display:none;position:absolute;left:0;right:-2000px;z-index:4;border:2px dashed '+G+';border-radius:4px;background:rgba(139,232,106,.12);pointer-events:none}'
   +'#mkGhost{position:fixed;z-index:9999;transform:translate(-50%,-140%);min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:'+G+';color:#0b1a07;font:700 16px "JetBrains Mono",monospace;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 8px 22px #000c}'
   +'#mkGhost[data-to]:not([data-to=""])::after{content:attr(data-to);position:absolute;top:100%;margin-top:4px;padding:2px 6px;border-radius:5px;background:#0b0d10;color:'+G+';font:700 12px "JetBrains Mono",monospace;white-space:nowrap}'
   +'.mk-tg{min-width:20px;height:20px;border-radius:5px;background:'+G+';color:#0b1a07;font:700 11px "JetBrains Mono",monospace;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}'
   +'.mk-ov{position:relative;display:block;width:100%;height:64px;margin:8px 0 4px;padding:0;border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden;background:#e8e9ee;cursor:pointer}'
   +'.mk-ov i{position:absolute;top:0;bottom:0;border-right:1px solid #0003;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}.mk-ov i.k{bottom:40%;background:#15161a;border-radius:0 0 3px 3px;z-index:2;padding-bottom:3px}'
   +'.mk-ov b{min-width:15px;height:15px;padding:0 2px;border-radius:4px;background:'+G+';color:#0b1a07;font:700 9px "JetBrains Mono",monospace;display:flex;align-items:center;justify-content:center}'
   +'#mkBar{position:fixed;z-index:9998;display:none;align-items:center;gap:8px;padding-left:56px;box-sizing:border-box;border:2px solid '+G+';border-radius:6px;background:rgba(139,232,106,.16);pointer-events:none;overflow:hidden;color:var(--white);font:700 14px Rajdhani,sans-serif;white-space:nowrap}'
   +'#mkBar.sw{border-style:dashed;background:rgba(255,196,77,.14);border-color:#ffc44d}#mkBar span{text-shadow:0 1px 3px #000}'
   +'.mk-ks{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}'
   +'.mk-wv{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:1px solid rgba(139,232,106,.28);background:linear-gradient(180deg,#14261d,#0c1510);color:var(--white);cursor:pointer;text-align:left}'
   +'.mk-wh{display:flex;align-items:center;gap:10px}.mk-wn{flex:1;font:700 18px Rajdhani,sans-serif}.mk-pl{width:34px;height:34px;border-radius:50%;background:rgba(139,232,106,.16);color:'+G+';display:flex;align-items:center;justify-content:center}.mk-pl .uic{width:16px;height:16px}'
   +'.mk-wv canvas{width:100%;height:48px;display:block}'
   +'.mk-mv{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--panel-inset);border:1px solid rgba(255,255,255,.06)}'
   +'.mk-ml{flex:1;color:var(--metal);font:600 15px Rajdhani,sans-serif}.mk-mv b{min-width:58px;text-align:center;font:700 18px "JetBrains Mono",monospace;color:var(--white)}'
   +'.mk-mv button{width:52px;height:48px;border-radius:10px;border:1px solid rgba(63,169,255,.4);background:rgba(63,169,255,.1);color:var(--blue-2);display:flex;align-items:center;justify-content:center;cursor:pointer}.mk-mv .uic{width:20px;height:20px}'
   +'.mk-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mk-row2 .act{min-height:48px;margin:0}'
   +'.mk-clr{align-self:center;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;margin-top:2px;border:0;background:none;color:#ff8b8b;font:700 14px Rajdhani,sans-serif;cursor:pointer}.mk-clr .uic{width:18px;height:18px}'
   +'.sheet .act.mk-del{border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08);color:#ff8b8b}'
   +'#mkTastChip{display:none!important}#sampleEditorOverlay.mode-slice #mkTastChip{display:inline-flex!important}#mkTastChip.on{border-color:'+G+';background:rgba(139,232,106,.14);color:'+G+'}#mkTastChip small{opacity:.75;font-size:11px;white-space:nowrap}#mkTastChip span{white-space:nowrap}';
  document.head.appendChild(st);
  // ---- Einstiege für die Leiste oben ----
  function editor(){ if(isPlaying) stop(); closeSheets(); if(prIsOpen()) prClose(); mkEditor(null); }
  function roll(){ closeSheets(); let tr=TRACKS.find(isKeys); if(!tr){ editor(); return; } if(!prIsOpen()) prOpen(tr); }
  function kbd(){ let tr=TRACKS.find(isKeys); if(!tr){ editor(); return; } openKb(tr); }
  function klang(){ let tr=TRACKS.find(isKeys); if(!tr){ editor(); return; } if(prIsOpen()) prClose(); openKlang(tr); }
  window.__mk={editor,roll,kbd,klang};
}

// ===== Rahmen-Steuerung =====
const fR=document.getElementById('fR');
function hook(){ const w=fR.contentWindow; try{ if(!w||w.eval('typeof TRACKS')!=='object') return null; if(!w.__mk) w.eval('('+MK.toString()+')()'); }catch(e){ console.error(e); return null; } return w.__mk; }
function boot(){ const w=fR.contentWindow; Promise.resolve(w.eval('initAudio()')).catch(()=>{}).then(()=>{ const m=hook(); if(m) m.editor(); }); }
fR.addEventListener('load',()=>setTimeout(boot,800));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const m=hook(); if(m) m[b.dataset.go](); });
const notes=document.getElementById('notes').innerHTML; document.getElementById('side').innerHTML=notes; const info=document.getElementById('info'); info.innerHTML=notes;
document.getElementById('infoBtn').onclick=()=>info.classList.toggle('open');
const fitTop=()=>{ const h=document.getElementById('mbar').offsetHeight; document.getElementById('stage').style.top=h+'px'; info.style.top=h+'px'; }; addEventListener('resize',fitTop); fitTop();
</script>
